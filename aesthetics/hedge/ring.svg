<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>Gold ring</title>
  <!-- NOTE: this file is parsed as strict XML. Two consecutive hyphens are illegal inside an
       XML comment, so the repo's usual dashed section banners must never be pasted in here
       (test_aesthetic_external.js parses every aesthetic .svg and fails the suite if one
       breaks). The ring is drawn as stroked circles rather than filled paths: one thick
       stroke is the torus body, and every rim and highlight is another thin stroke on the
       same centre, which keeps the shading concentric no matter what size it renders at. -->
  <defs>
    <linearGradient id="hgGold" x1="0.16" y1="0.04" x2="0.86" y2="0.96">
      <stop offset="0" stop-color="#fff7d4"/>
      <stop offset="0.15" stop-color="#ffdf78"/>
      <stop offset="0.38" stop-color="#f0b62c"/>
      <stop offset="0.6" stop-color="#b8750f"/>
      <stop offset="0.82" stop-color="#eab63f"/>
      <stop offset="1" stop-color="#83550f"/>
    </linearGradient>
    <filter id="hgSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="hgSofter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <!-- Torus body: outer edge at r=106, hole at r=62. -->
  <circle cx="120" cy="120" r="84" fill="none" stroke="url(#hgGold)" stroke-width="44"/>

  <!-- Rims. The hole gets a warm core shadow just inside it and a lit lip just outside that,
       which is what reads as roundness at small sizes; the outer edge only needs darkening. -->
  <circle cx="120" cy="120" r="64" fill="none" stroke="#6d4205" stroke-width="6" opacity="0.5"/>
  <circle cx="120" cy="120" r="68" fill="none" stroke="#ffe9a8" stroke-width="2" opacity="0.3"/>
  <circle cx="120" cy="120" r="104" fill="none" stroke="#7a4d0a" stroke-width="5" opacity="0.38"/>
  <circle cx="120" cy="120" r="106" fill="none" stroke="#4a2c05" stroke-width="2" opacity="0.75"/>

  <!-- Speculars: the big one up the top left where the key light lands, a short one bottom
       right for the bounce, and a thin one on the hole's top edge. -->
  <path d="M31.1 96.2 A 92 92 0 0 1 112 28.4" fill="none" stroke="#fffbe8" stroke-width="13"
        stroke-linecap="round" opacity="0.72" filter="url(#hgSoft)"/>
  <path d="M199.7 166 A 92 92 0 0 1 158.9 203.4" fill="none" stroke="#ffeab0" stroke-width="9"
        stroke-linecap="round" opacity="0.4" filter="url(#hgSofter)"/>
  <path d="M53.2 96.3 A 70 70 0 0 1 97.1 53.1" fill="none" stroke="#fff6d8" stroke-width="4"
        stroke-linecap="round" opacity="0.5" filter="url(#hgSoft)"/>
</svg>

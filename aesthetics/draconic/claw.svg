<svg xmlns="http://www.w3.org/2000/svg" width="80" height="100" viewBox="0 0 80 100">
  <!--
    Dragon talon track, used as a CSS mask for the home tiles (see theme.css).

    Traced off a reference theropod print, and the important correction over the previous
    version is that this is ONE connected shape, not three digits floating above a separate
    heel pad. A real talon track has the toes converging into a single ankle that carries on
    downward and tapers to a point — that long trailing heel is most of what makes it read as
    a track rather than a paw or a crown.

    Taller than wide (80x100) for the same reason: splayed-wide shapes read as horns. All three
    toes run to nearly the same length — a long middle over two short side lobes reads as a
    fleur-de-lis, not a track.

    Filled white because only the alpha matters — the fire gradient underneath supplies colour.
  -->
  <path fill="#fff" d="
    M40 1
    C43 12, 45 30, 46 46
    C47.5 48, 48.5 49, 49.5 50
    C55 40, 64 24, 71 15
    C73.5 11.5, 77 11, 77.5 14
    C78 18, 73 27, 66 37
    C61 44, 56 52, 53.5 62
    C50.5 74, 44 90, 40 99
    C36 90, 29.5 74, 26.5 62
    C24 52, 19 44, 14 37
    C7 27, 2 18, 2.5 14
    C3 11, 6.5 11.5, 9 15
    C16 24, 25 40, 30.5 50
    C31.5 49, 32.5 48, 34 46
    C35 30, 37 12, 40 1
    Z"/>
</svg>

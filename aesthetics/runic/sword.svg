<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 560" width="200" height="560">
<!--
  Runic — the floating sword.

  Deliberately CROPPED: the blade runs straight off the top of the viewBox and the point is
  never drawn. theme.css parks this over the left third of the backdrop and parallaxes it
  (aesthetics/runic/fx.ts), so the top of the frame is where the blade leaves the room rather
  than an edge you're meant to notice. Drawing the whole sword and scaling it down would put
  the point somewhere in the middle of the screen, which reads as an object sitting on the
  page instead of one passing through it.

  Lit green rather than the blue of the reference. The glow is built in here (a blurred copy
  of the blade under the sharp one, plus the rune inscriptions) rather than as a CSS filter,
  because a filter on the layer would blur the crisp steel highlights along with everything
  else.

  Referenced by url() from theme.css, so page CSS cannot reach inside — every colour here is
  fixed, which is also why the theme's accent picker doesn't recolour it. Green, brown and
  steel are the constants of this aesthetic; the accent tints the UI around it.
-->
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#5c6a72"/>
    <stop offset="18%"  stop-color="#9fb0b8"/>
    <stop offset="42%"  stop-color="#eef4f6"/>
    <stop offset="52%"  stop-color="#c3d0d6"/>
    <stop offset="78%"  stop-color="#7d8c95"/>
    <stop offset="100%" stop-color="#48545c"/>
  </linearGradient>
  <linearGradient id="fuller" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#2b353b"/>
    <stop offset="50%"  stop-color="#4e5f68"/>
    <stop offset="100%" stop-color="#232c31"/>
  </linearGradient>
  <linearGradient id="guardMetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#e3ecef"/>
    <stop offset="45%"  stop-color="#8b9aa3"/>
    <stop offset="55%"  stop-color="#4a565e"/>
    <stop offset="100%" stop-color="#93a2ab"/>
  </linearGradient>
  <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#2a1a10"/>
    <stop offset="30%"  stop-color="#5c3d24"/>
    <stop offset="55%"  stop-color="#734d2d"/>
    <stop offset="100%" stop-color="#241610"/>
  </linearGradient>
  <filter id="halo" x="-140%" y="-60%" width="380%" height="220%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="runeGlow" x="-300%" y="-40%" width="700%" height="180%">
    <feGaussianBlur stdDeviation="3.5"/>
  </filter>
</defs>

<!-- Green halo: a blurred copy of the blade silhouette, sitting under the crisp steel. -->
<g filter="url(#halo)" opacity="0.85">
  <path d="M74,0 L126,0 L136,322 L64,322 Z" fill="#2fe08a"/>
  <ellipse cx="100" cy="352" rx="66" ry="26" fill="#2fe08a"/>
  <ellipse cx="100" cy="514" rx="20" ry="20" fill="#3ff0a0"/>
</g>

<!-- Blade. Widest at the guard, tapering as it leaves frame. -->
<path d="M78,0 L122,0 L132,318 L68,318 Z" fill="url(#steel)"/>
<path d="M92,0 L108,0 L112,300 L88,300 Z" fill="url(#fuller)" opacity="0.9"/>
<path d="M99,0 L101,0 L101,300 L99,300 Z" fill="#f4fbfd" opacity="0.5"/>

<!-- Rune inscription running down the fuller. Elder Futhark staves, same alphabet as the wall. -->
<g stroke="#8dffc4" stroke-width="2.2" fill="none" stroke-linecap="round">
  <g filter="url(#runeGlow)" stroke="#2fe08a" stroke-width="5" opacity="0.75">
    <path d="M100,36 V64 M100,42 L109,38 M100,52 L109,48"/>
    <path d="M94,86 L106,110 M106,86 L94,110"/>
    <path d="M100,178 V150 M100,150 L92,142 M100,150 L108,142"/>
    <path d="M107,200 L94,212 L107,224 L94,236"/>
    <path d="M100,262 V290 M94,268 L106,282 M106,268 L94,282"/>
  </g>
  <path d="M100,36 V64 M100,42 L109,38 M100,52 L109,48"/>
  <path d="M94,86 L106,110 M106,86 L94,110"/>
  <path d="M100,132 V160 M100,132 L108,140"/>
  <path d="M100,178 V150 M100,150 L92,142 M100,150 L108,142"/>
  <path d="M107,200 L94,212 L107,224 L94,236"/>
  <path d="M100,262 V290 M94,268 L106,282 M106,268 L94,282"/>
</g>

<!-- Crossguard: swept wings curving down and out, the way the reference's does. -->
<path d="M100,316
         C 78,316 60,322 40,340
         C 26,352 18,366 14,382
         C 30,372 46,362 64,356
         C 76,352 88,350 100,350
         C 112,350 124,352 136,356
         C 154,362 170,372 186,382
         C 182,366 174,352 160,340
         C 140,322 122,316 100,316 Z"
      fill="url(#guardMetal)" stroke="#2b343a" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M100,322 C 80,322 64,328 46,344" fill="none" stroke="#f2f8fa" stroke-width="2" opacity="0.55"/>

<!-- Grip: wrapped leather over the tang. -->
<path d="M86,350 L114,350 L110,486 L90,486 Z" fill="url(#grip)"/>
<g stroke="#1a0f08" stroke-width="3" opacity="0.75">
  <path d="M86,364 L114,372 M86,386 L113,394 M87,408 L113,416 M87,430 L112,438 M88,452 L112,460 M88,474 L111,481"/>
</g>
<g stroke="#a97a4a" stroke-width="1.1" opacity="0.5">
  <path d="M86,360 L114,368 M86,382 L113,390 M87,404 L113,412 M87,426 L112,434 M88,448 L112,456 M88,470 L111,477"/>
</g>

<!-- Pommel with a green stone. -->
<path d="M100,484 L124,502 L100,538 L76,502 Z" fill="url(#guardMetal)" stroke="#2b343a" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="100" cy="508" r="9" fill="#2fe08a"/>
<circle cx="100" cy="508" r="9" fill="none" stroke="#0d2a1c" stroke-width="1.6"/>
<circle cx="97" cy="505" r="3" fill="#c8ffe4" opacity="0.85"/>
</svg>

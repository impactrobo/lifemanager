<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 10" width="160" height="10">
<!--
  Runic — the hashed band.

  Pared back to the twisted-wire rope alone: two rails with diagonal hatching between them.
  The Borre-style spiral scrolls, the curved connector and the granules that the reference
  jewellery has were drawn here first and then removed — at 12px tall on a phone they read as
  a row of "@" signs rather than as silverwork, and the straight hatch is the part that
  actually holds up at this size.

  TILEABLE HORIZONTALLY. theme.css repeats it under the topbar, after every section title and
  along the bottom inside edge of panels, so the ends have to meet: the hatch runs edge to edge
  on a 10px period, which divides 160 exactly. Change the width and the period has to divide it.

  DRAWN IN THE LIT GREEN, not in silver. theme.css animates `filter: brightness()` on it, from
  near-black up to full, so the band starts as a dark cut in the surface and then glows in step
  with the runes on the wall. A silver drawing can't be turned green by brightness alone, so the
  colour has to live here and the darkness has to be the animated end. Anything referenced by
  url() is out of reach of page CSS, which is why the state that changes is a filter and not
  a fill.
-->
<g fill="none" stroke-linecap="round">
  <!-- Dark under-layer, offset, so the band keeps some depth at full brightness. -->
  <g stroke="#08140d" stroke-width="2.6" opacity="0.9" transform="translate(0.5,0.7)">
    <path d="M0,2.4 H160 M0,7.6 H160"/>
    <path d="M0,7.6 L6,2.4 M10,7.6 L16,2.4 M20,7.6 L26,2.4 M30,7.6 L36,2.4 M40,7.6 L46,2.4
             M50,7.6 L56,2.4 M60,7.6 L66,2.4 M70,7.6 L76,2.4 M80,7.6 L86,2.4 M90,7.6 L96,2.4
             M100,7.6 L106,2.4 M110,7.6 L116,2.4 M120,7.6 L126,2.4 M130,7.6 L136,2.4
             M140,7.6 L146,2.4 M150,7.6 L156,2.4"/>
  </g>
  <g stroke="#8dffc4" stroke-width="1.5">
    <path d="M0,2.4 H160 M0,7.6 H160"/>
    <path d="M0,7.6 L6,2.4 M10,7.6 L16,2.4 M20,7.6 L26,2.4 M30,7.6 L36,2.4 M40,7.6 L46,2.4
             M50,7.6 L56,2.4 M60,7.6 L66,2.4 M70,7.6 L76,2.4 M80,7.6 L86,2.4 M90,7.6 L96,2.4
             M100,7.6 L106,2.4 M110,7.6 L116,2.4 M120,7.6 L126,2.4 M130,7.6 L136,2.4
             M140,7.6 L146,2.4 M150,7.6 L156,2.4"/>
  </g>
</g>
</svg>

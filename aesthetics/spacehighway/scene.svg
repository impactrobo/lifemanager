<?xml version="1.0" encoding="UTF-8"?>
<!-- Space Highway — the fixed scenery behind the UI.
     Portrait 900x1600 (authored phone-shaped: `background-size: cover` on landscape art
     crops to the middle third and the composition is lost — see the architecture notes).
     Baked colours on purpose: art referenced by url() is out of reach of page CSS, so this
     stays sector-neutral (sunlit-tan Saturn, grey concrete, steel rail). What recolours per
     SECTOR is the CSS backdrop wash, the star field and the swirl — all in theme.css. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sat" x1="0.05" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e6d3a3"/>
      <stop offset="0.38" stop-color="#a9c6d2"/>
      <stop offset="0.68" stop-color="#6b96a7"/>
      <stop offset="1" stop-color="#37596a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#484d58"/>
      <stop offset="0.5" stop-color="#343945"/>
      <stop offset="1" stop-color="#1d212d"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c4d68"/>
      <stop offset="0.25" stop-color="#1a2030"/>
      <stop offset="1" stop-color="#0c0f18"/>
    </linearGradient>
    <radialGradient id="vp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2ead6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#cdb98c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#cdb98c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Saturn's limb, curving in from the lower left. Atmosphere rim first (blurred), body over it. -->
  <circle cx="-80" cy="560" r="812" fill="#cfe6f0" opacity="0.75" filter="url(#soft)"/>
  <circle cx="-80" cy="560" r="780" fill="url(#sat)"/>
  <!-- banding, following the curvature -->
  <g fill="none" stroke-linecap="round">
    <path d="M -80 -40 A 780 780 0 0 1 660 430" stroke="#f4e9cd" stroke-width="14" opacity="0.42"/>
    <path d="M -80 210 A 780 780 0 0 1 660 690" stroke="#ffffff" stroke-width="8" opacity="0.22"/>
    <path d="M -80 430 A 780 780 0 0 1 520 940" stroke="#294654" stroke-width="18" opacity="0.34"/>
    <path d="M -80 760 A 780 780 0 0 1 300 1240" stroke="#ffffff" stroke-width="6" opacity="0.13"/>
    <path d="M -80 980 A 780 780 0 0 1 150 1420" stroke="#1c3542" stroke-width="16" opacity="0.28"/>
  </g>
  <!-- a bright sunlit crescent along the very edge -->
  <path d="M -80 -60 A 780 780 0 0 1 470 1180" stroke="#fdf3d8" stroke-width="6" opacity="0.5" fill="none"/>

  <!-- Distant ridge along the horizon on the right, where the ring meets the stars. -->
  <path d="M 470 706 L 900 690 L 900 812 L 470 760 Z" fill="url(#ridge)"/>

  <!-- Glow at the vanishing point — the road runs toward the light. -->
  <ellipse cx="602" cy="706" rx="150" ry="70" fill="url(#vp)"/>

  <!-- The paved ring. Wide at the bottom, banked, narrowing to a slot near the horizon. -->
  <path d="M 20 1600 L 566 704 L 636 704 L 880 1600 Z" fill="url(#road)"/>

  <!-- Ring divisions doubling as lengthwise road texture, converging on the vanishing point. -->
  <g stroke-linecap="round" opacity="0.5">
    <line x1="150" y1="1600" x2="576" y2="705" stroke="#565b68" stroke-width="7"/>
    <line x1="360" y1="1600" x2="592" y2="705" stroke="#33384a" stroke-width="9"/>
    <line x1="560" y1="1600" x2="606" y2="705" stroke="#565b68" stroke-width="6"/>
    <line x1="740" y1="1600" x2="622" y2="705" stroke="#33384a" stroke-width="8"/>
  </g>

  <!-- Lane markings. Centre dashes + bright edge lines to the vanishing point. -->
  <line x1="452" y1="1600" x2="600" y2="706" stroke="#dfe3ea" stroke-width="12"
        stroke-dasharray="46 60" opacity="0.85"/>
  <line x1="20" y1="1600" x2="566" y2="705" stroke="#c3cad3" stroke-width="5" opacity="0.55"/>
  <line x1="880" y1="1600" x2="636" y2="705" stroke="#c3cad3" stroke-width="5" opacity="0.55"/>

  <!-- Guardrail down the right shoulder, posts and rail shrinking toward the horizon. -->
  <g stroke="#b3bcc6" stroke-linecap="round">
    <polyline points="742,1372 690,1128 654,952 632,838 620,772 613,732"
              fill="none" stroke="#cdd4dd" stroke-width="6" opacity="0.9"/>
    <line x1="742" y1="1372" x2="742" y2="1300" stroke-width="12"/>
    <line x1="690" y1="1128" x2="690" y2="1076" stroke-width="9"/>
    <line x1="654" y1="952"  x2="654" y2="916"  stroke-width="7"/>
    <line x1="632" y1="838"  x2="632" y2="812"  stroke-width="5"/>
    <line x1="620" y1="772"  x2="620" y2="754"  stroke-width="4"/>
    <line x1="613" y1="732"  x2="613" y2="720"  stroke-width="3"/>
  </g>

  <!-- Two sedans heading up the ring, rear three-quarter, lower third. Scenery scale. -->
  <g>
    <!-- near car, left lane -->
    <g transform="translate(300 1290)">
      <path d="M -78 44 Q -84 4 -66 -6 Q -40 -46 0 -48 Q 40 -46 66 -6 Q 84 4 78 44 Z" fill="#93404a"/>
      <path d="M -50 -6 Q -34 -34 0 -36 Q 34 -34 50 -6 Z" fill="#242832"/>
      <rect x="-80" y="30" width="24" height="16" rx="5" fill="#ff5a3c"/>
      <rect x="56" y="30" width="24" height="16" rx="5" fill="#ff5a3c"/>
      <ellipse cx="0" cy="52" rx="70" ry="10" fill="#000000" opacity="0.35"/>
    </g>
    <!-- far car, right lane -->
    <g transform="translate(520 1074) scale(0.62)">
      <path d="M -78 44 Q -84 4 -66 -6 Q -40 -46 0 -48 Q 40 -46 66 -6 Q 84 4 78 44 Z" fill="#9aacbb"/>
      <path d="M -50 -6 Q -34 -34 0 -36 Q 34 -34 50 -6 Z" fill="#2b303a"/>
      <rect x="-80" y="30" width="22" height="15" rx="5" fill="#ffb038"/>
      <rect x="58" y="30" width="22" height="15" rx="5" fill="#ffb038"/>
      <ellipse cx="0" cy="52" rx="70" ry="10" fill="#000000" opacity="0.3"/>
    </g>
  </g>
</svg>

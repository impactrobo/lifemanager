<?xml version="1.0" encoding="UTF-8"?>
<!-- Space Highway — the saucer that crosses the sky now and then (reference 5).
     Baked metallic with an amber underside ring: a craft is a physical object, not something the
     SECTOR repaints. Lives on the far sky layer in theme.css, so it passes ABOVE the horizon and
     behind the windshield frame, which is where an aircraft belongs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="132" viewBox="0 0 320 132">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3dae4"/>
      <stop offset="0.30" stop-color="#8e99a8"/>
      <stop offset="0.48" stop-color="#4a5361"/>
      <stop offset="0.56" stop-color="#232a34"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="dome" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e8eef6"/>
      <stop offset="0.42" stop-color="#7f8b9b"/>
      <stop offset="1" stop-color="#2d3540"/>
    </linearGradient>
    <radialGradient id="under" cx="0.5" cy="0.35" r="0.62">
      <stop offset="0" stop-color="#fff2cf"/>
      <stop offset="0.35" stop-color="#ffb03a"/>
      <stop offset="0.72" stop-color="#e0651a" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#e0651a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- underside bloom, drawn first so the hull sits on top of it -->
  <ellipse cx="160" cy="94" rx="86" ry="30" fill="url(#under)" filter="url(#glow)" opacity="0.95"/>

  <!-- dome -->
  <path d="M 106 58 Q 112 14 160 12 Q 208 14 214 58 Z" fill="url(#dome)"/>
  <ellipse cx="141" cy="31" rx="17" ry="9" fill="#ffffff" opacity="0.5" transform="rotate(-20 141 31)"/>

  <!-- hull -->
  <ellipse cx="160" cy="62" rx="152" ry="26" fill="url(#hull)"/>
  <ellipse cx="160" cy="56" rx="152" ry="20" fill="#aeb9c6" opacity="0.32"/>
  <ellipse cx="160" cy="53" rx="120" ry="11" fill="#eef3f9" opacity="0.28"/>

  <!-- rim lights -->
  <g fill="#ffce6a">
    <circle cx="40" cy="66" r="4"/><circle cx="72" cy="72" r="4.5"/><circle cx="106" cy="76" r="5"/>
    <circle cx="160" cy="78" r="5.5"/><circle cx="214" cy="76" r="5"/><circle cx="248" cy="72" r="4.5"/>
    <circle cx="280" cy="66" r="4"/>
  </g>

  <!-- the lit ring on the belly -->
  <ellipse cx="160" cy="82" rx="52" ry="13" fill="#ffdf9a" opacity="0.95"/>
  <ellipse cx="160" cy="82" rx="30" ry="7" fill="#fffaf0"/>
</svg>

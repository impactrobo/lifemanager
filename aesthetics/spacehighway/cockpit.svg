<?xml version="1.0" encoding="UTF-8"?>
<!-- Space Highway — the car you're sitting in: windshield frame + dashboard.
     Portrait 900x1600 to match road.svg exactly, so the horizon (y=618) lands in the glass and
     the dash's leading edge sits at y~1140. Everything above the dash and inside the pillars is
     TRANSPARENT — that's the windshield, and the road and star layers behind show through it.

     LAID OUT FOR THE CROP. As a `background-size: cover` layer on a 390x844 phone this renders
     474x844, so roughly x=80..820 of this canvas is what you actually see and anything outside
     that is cut. The pillars are therefore wide (0..140 / 760..900) so a slice of each survives,
     and every instrument lives between x=140 and x=830. Vertically nothing is cropped, but the
     sticky topbar covers the top ~100 units and the tabbar the bottom ~145, so the dash's
     readable band is y=1140..1450.

     Baked sector-neutral (near-black interior plastic, chrome trim, white dial faces): art
     referenced by url() can't read the page's custom properties. The parts that DO take the
     SECTOR hue — the dash LED spill, the centre readout's glow, the road bloom — are CSS layers
     stacked over this in theme.css. The lower console is deliberately sparse: the restyled
     .tabbar is the bottom half of this console and covers that zone. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600">
  <defs>
    <linearGradient id="dashface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c38"/>
      <stop offset="0.10" stop-color="#161b24"/>
      <stop offset="0.55" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="pillarL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="1" stop-color="#1c212b"/>
    </linearGradient>
    <linearGradient id="pillarR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="1" stop-color="#1c212b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd8e4"/>
      <stop offset="0.44" stop-color="#808b99"/>
      <stop offset="0.52" stop-color="#333b46"/>
      <stop offset="1" stop-color="#9da8b5"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.5" cy="0.34" r="0.74">
      <stop offset="0" stop-color="#242b37"/>
      <stop offset="0.70" stop-color="#11151c"/>
      <stop offset="1" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="vent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040608"/>
      <stop offset="1" stop-color="#1b202a"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d343f"/>
      <stop offset="0.35" stop-color="#141922"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
  </defs>

  <!-- = Windshield frame = -->
  <!-- Headliner across the top; the sticky topbar covers most of it, this is the sliver above. -->
  <path d="M 0 0 L 900 0 L 900 30 Q 450 78 0 30 Z" fill="#0a0c11"/>
  <!-- A-pillars. Wide enough that a slice survives the horizontal crop (see the header note). -->
  <path d="M 0 0 L 140 0 L 62 1150 L 0 1150 Z" fill="url(#pillarL)"/>
  <path d="M 900 0 L 760 0 L 838 1150 L 900 1150 Z" fill="url(#pillarR)"/>
  <path d="M 140 8 L 62 1144" stroke="#586675" stroke-width="4" opacity="0.55" fill="none"/>
  <path d="M 760 8 L 838 1144" stroke="#586675" stroke-width="4" opacity="0.55" fill="none"/>

  <!-- = Dashboard = -->
  <!-- Leading edge: level across, humped up over the instrument binnacle on the left. -->
  <path d="M 0 1150
           L 110 1144
           Q 150 1052 250 1046
           Q 350 1052 392 1138
           Q 650 1120 900 1132
           L 900 1600 L 0 1600 Z" fill="url(#dashface)"/>
  <!-- chrome lip catching the sky along the whole leading edge -->
  <path d="M 0 1150
           L 110 1144
           Q 150 1052 250 1046
           Q 350 1052 392 1138
           Q 650 1120 900 1132"
        fill="none" stroke="url(#chrome)" stroke-width="7" opacity="0.8"/>

  <!-- Speedometer -->
  <g>
    <circle cx="250" cy="1272" r="110" fill="url(#chrome)" opacity="0.7"/>
    <circle cx="250" cy="1272" r="100" fill="url(#dial)"/>
    <g stroke="#c9d6e4" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <line x1="250" y1="1184" x2="250" y2="1202"/>
      <line x1="312" y1="1210" x2="300" y2="1222"/>
      <line x1="338" y1="1272" x2="320" y2="1272"/>
      <line x1="312" y1="1334" x2="300" y2="1322"/>
      <line x1="250" y1="1360" x2="250" y2="1342"/>
      <line x1="188" y1="1334" x2="200" y2="1322"/>
      <line x1="162" y1="1272" x2="180" y2="1272"/>
      <line x1="188" y1="1210" x2="200" y2="1222"/>
    </g>
    <g stroke="#6d7d8e" stroke-width="3" stroke-linecap="round" opacity="0.65">
      <line x1="283" y1="1191" x2="277" y2="1207"/>
      <line x1="331" y1="1239" x2="315" y2="1245"/>
      <line x1="331" y1="1305" x2="315" y2="1299"/>
      <line x1="283" y1="1353" x2="277" y2="1337"/>
      <line x1="217" y1="1353" x2="223" y2="1337"/>
      <line x1="169" y1="1305" x2="185" y2="1299"/>
      <line x1="169" y1="1239" x2="185" y2="1245"/>
      <line x1="217" y1="1191" x2="223" y2="1207"/>
    </g>
    <!-- needle, parked at a cruising speed -->
    <path d="M 250 1272 L 322 1216 L 254 1263 Z" fill="#ff4438"/>
    <circle cx="250" cy="1272" r="14" fill="#39414d"/>
    <circle cx="250" cy="1272" r="6" fill="#aab6c4"/>
  </g>

  <!-- Centre readout. The glow over it is a CSS layer, so it takes the SECTOR hue. -->
  <rect x="470" y="1186" width="248" height="132" rx="16" fill="url(#chrome)" opacity="0.65"/>
  <rect x="480" y="1196" width="228" height="112" rx="11" fill="#04161a"/>
  <g fill="#0d3a44">
    <rect x="500" y="1218" width="42" height="68" rx="5"/>
    <rect x="554" y="1218" width="42" height="68" rx="5"/>
    <rect x="608" y="1218" width="42" height="68" rx="5"/>
    <rect x="664" y="1258" width="30" height="28" rx="5"/>
  </g>

  <!-- Vent, far right — half of it falls outside the crop, which reads as the dash continuing. -->
  <circle cx="800" cy="1252" r="50" fill="url(#chrome)" opacity="0.55"/>
  <circle cx="800" cy="1252" r="42" fill="url(#vent)"/>
  <g stroke="#39414d" stroke-width="5" opacity="0.9">
    <line x1="764" y1="1235" x2="836" y2="1235"/>
    <line x1="760" y1="1252" x2="840" y2="1252"/>
    <line x1="764" y1="1269" x2="836" y2="1269"/>
  </g>

  <!-- Sparse lower console — the restyled .tabbar is the rest of it. -->
  <rect x="470" y="1358" width="248" height="76" rx="14" fill="#0e121a" stroke="#39414d" stroke-width="3"/>
  <g fill="#2a3240">
    <rect x="492" y="1376" width="64" height="15" rx="5"/>
    <rect x="568" y="1376" width="34" height="15" rx="5"/>
    <rect x="614" y="1376" width="34" height="15" rx="5"/>
  </g>
  <g fill="#222a35">
    <circle cx="506" cy="1412" r="14"/>
    <circle cx="548" cy="1412" r="14"/>
    <circle cx="590" cy="1412" r="14"/>
    <circle cx="632" cy="1412" r="14"/>
  </g>

  <!-- Steering wheel: only the crown of the rim clears the dash, the way it does from the seat. -->
  <circle cx="300" cy="1668" r="250" fill="none" stroke="url(#wheel)" stroke-width="44"/>
  <circle cx="300" cy="1668" r="250" fill="none" stroke="#4a5462" stroke-width="4" opacity="0.5"/>
</svg>

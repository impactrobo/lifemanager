<svg xmlns="http://www.w3.org/2000/svg" width="100" height="86" viewBox="0 0 100 86">
  <!--
    Brilliant-cut gem silhouette, used as a CSS mask for the home tiles (see theme.css).
    Only the outline lives here — the facets are built from gradients underneath the mask,
    which is what lets one shape file serve six different stones.

    Traced off a reference set of cut gems, so the proportions are the real ones rather than a
    kite: a broad flat table, a shallow bevelled crown, the girdle as the widest point about a
    third of the way down, then a deep pavilion falling to the culet. Wider than tall (100x86)
    for the same reason — a cut stone viewed face-on is a squat shape, and a square one reads
    as a playing-card diamond instead.
  -->
  <path fill="#fff" d="
    M24 6 L76 6
    L92 17 L99 30
    L50 85
    L1 30 L8 17 Z"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!--
    Brilliant-cut gem outline, used as a CSS mask for the home tiles (see theme.css).
    Only the silhouette lives here — the facets are drawn underneath the mask with a
    repeating-conic-gradient, which is what lets each tile take a different hue from one
    shared shape file.

    Chosen over a plain rhombus for a practical reason as much as a stylistic one: the flat
    table and wide shoulders give the top half real width, which is where the icon and the
    section label have to sit. A rotated square is narrowest exactly where the label goes.

    Proportions: table y=5, girdle (widest) y=40, culet (point) y=97 — a shallow crown over a
    deep pavilion, which is what reads as a cut stone rather than a kite.
  -->
  <path fill="#fff" d="M32 5 L68 5 L88 22 L97 40 L50 97 L3 40 L12 22 Z"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>LIFEMan.EXE — P-Zero Tracker</title>
<!-- BUMP THIS on every deploy that changes index.html / app.js / styles.css / an aesthetic.
     app.js re-fetches this page on launch + on foreground and reloads if this value moved —
     that's what lets an installed iOS PWA self-update instead of getting stuck on a snapshot.
     Format is just a sortable stamp; the value only has to differ from the last deploy. -->
<meta name="app-build" content="2026.09.06-2">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIFEMan">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Baloo+2:wght@500;600;700;800&family=Yuji+Syuku&family=Comfortaa:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Wallpoet&family=Metal+Mania&family=Oswald:wght@400;500;600;700&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Creepster&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- Swapped by applyAesthetic() to aesthetics/<key>/theme.css for aesthetics flagged
     `external` in the AESTHETICS registry; stays empty for the built-in ones whose blocks
     live in styles.css. See docs/ARCHITECTURE.md > "Aesthetic file layout". -->
<link rel="stylesheet" id="aestheticCss">
</head>
<body>

<div class="topbar">
  <div class="nav-btns">
    <button class="icon-btn back-btn disabled" onclick="goBack()" title="Back" id="backBtn"></button>
    <button class="icon-btn forward-btn disabled" onclick="goForward()" title="Forward" id="forwardBtn"></button>
  </div>
  <div class="brand"><span>L</span>IFE<span>M</span>an<span>.EXE</span></div>
  <div class="nav-btns-right">
    <button class="icon-btn hidden" onclick="toggleHomeEditMode()" title="Edit layout" id="homeEditBtn"></button>
    <button class="icon-btn settings-btn" onclick="openSetup('home')" title="Settings" id="settingsBtn"></button>
  </div>
</div>

<div id="app"></div>

<div class="tabbar hidden" id="tabbar"></div>
<div id="tabbarScrollIndicator" class="scroll-indicator scroll-indicator-h"></div>

<button class="icon-btn rest-timer-fab" id="restTimerFab" onclick="openRestPicker()" title="Rest timer"></button>
<div class="rest-timer-widget panel hidden" id="restTimerWidget"></div>

<div id="toast" class="toast"></div>
<div id="pageScrollIndicator" class="scroll-indicator scroll-indicator-page"></div>

<div id="confirmOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <div id="confirmMsg" class="modal-msg"></div>
    <div class="modal-actions">
      <button class="btn btn-block" onclick="closeConfirm()">CANCEL</button>
      <button id="confirmYesBtn" class="btn btn-danger btn-block" onclick="confirmYes()">CONFIRM</button>
    </div>
  </div>
</div>

<div id="imageLightboxOverlay" class="modal-overlay hidden" onclick="closeImageLightbox()">
  <img id="imageLightboxImg" src="" alt="" style="max-width:100%; max-height:88vh; border-radius:var(--radius); box-shadow:0 8px 30px rgba(0,0,0,0.5);">
</div>

<div id="restPickerOverlay" class="modal-overlay hidden" onclick="if(event.target===this)closeRestPicker()">
  <div class="modal-box">
    <div class="section-title" style="margin-bottom:14px;">Rest Timer</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">
      <button class="btn btn-sm" onclick="startPresetRestTimer(60)">1:00</button>
      <button class="btn btn-sm" onclick="startPresetRestTimer(90)">1:30</button>
      <button class="btn btn-sm" onclick="startPresetRestTimer(120)">2:00</button>
      <button class="btn btn-sm" onclick="startPresetRestTimer(180)">3:00</button>
      <button class="btn btn-sm" onclick="startPresetRestTimer(300)">5:00</button>
    </div>
    <div class="field-row">
      <label class="field"><span class="lbl">Minutes</span><input type="number" id="restCustomMinutes" min="0" step="1" placeholder="0"></label>
      <label class="field"><span class="lbl">Seconds</span><input type="number" id="restCustomSeconds" min="0" max="59" step="1" placeholder="0"></label>
    </div>
    <button class="btn btn-primary btn-block" onclick="startCustomRestTimer()">START</button>
    <button class="btn btn-block" style="margin-top:8px;" onclick="closeRestPicker()">CANCEL</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<!-- Cloud Sync (opt-in): Firebase's "compat" build exposes a plain global `firebase` object,
     same style as Chart.js above — no bundler, no ES module scoping issues, works fine inside
     the classic-script app below. See the CLOUD SYNC section near the end of the main script. -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>

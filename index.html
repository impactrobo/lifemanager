function workoutCompletion(cycle, workout) {
  const log = STATE.logs[logKey(cycle, workout.id)];
  if (!log) return 'empty';
  const enabledTiers = enabledTierKeys(workout);
  if (enabledTiers.length === 0) return 'empty';
  // Weight is often left at its pre-filled target and never explicitly re-typed, so
  // completion is judged by reps logged (the actual "I did this set" signal), not weight.
  const filled = enabledTiers.filter(tk => log.entries[tk] && log.entries[tk].sets && log.entries[tk].sets.some(s => s.reps !== undefined && s.reps !== ''));
  if (filled.length === 0) return 'empty';
  if (filled.length === enabledTiers.length) return 'done';
  return 'partial';
}
function enabledTierKeys(workout) {
  const keys = [];
  if (workout.t1.enabled && workout.t1.categoryId) keys.push('t1');
  if (workout.t2a.enabled && workout.t2a.categoryId) keys.push('t2a');
  if (workout.t2b.enabled && workout.t2b.categoryId) keys.push('t2b');
  if (workout.t2c.enabled && workout.t2c.categoryId) keys.push('t2c');
  workout.t3.forEach((t, i) => { if (t.enabled && t.name) keys.push('t3_' + i); });
  return keys;
}
// ---- exercises[]-shaped workouts (Hypertrophy/Free Entry/Mobility/Warmup) equivalents of
// workoutCompletion/enabledTierKeys/workoutIcon above ----
function mesoWorkoutCompletion(cycle, workout) {
  const log = STATE.logs[logKey(cycle, workout.id)];
  if (!log || workout.exercises.length === 0) return 'empty';
  const filled = workout.exercises.filter(ex => log.entries[ex.id] && log.entries[ex.id].sets && log.entries[ex.id].sets.some(s => s.reps !== undefined && s.reps !== ''));
  if (filled.length === 0) return 'empty';
  if (filled.length === workout.exercises.length) return 'done';
  return 'partial';
}
function mesoWorkoutIcon(workout) {
  const withMuscle = workout.exercises.find(ex => ex.muscle);
  return withMuscle ? muscleIcon(withMuscle.muscle) : '';
}

// Renders one workout-type section (grid of cells + a small summary line) for renderTrainGrid.
// `list` is workoutsByType(type); `openFn` is the click handler name. Weights workouts branch
// per-item on shape (GZCL tiers vs exercises[]) since style is chosen per-workout now.
function renderTrainSection(type, list, cycle, openFn) {
  if (list.length === 0) {
    return `<div class="empty-state" style="padding:16px 10px;">
      <div style="font-size:12px;">No ${WORKOUT_TYPE_LABELS[type].toLowerCase()} workouts yet — add one under <b style="color:var(--text)">Setup &rarr; Workout Builder</b>.</div>
    </div>`;
  }
  if (type === 'cardio') {
    const cells = list.map((c, i) => {
      const clog = STATE.logs[logKey(cycle, c.id)];
      const status = clog && clog.date ? 'done' : 'empty';
      const flair = status === 'empty' ? 'unfinished-cardio' : '';
      const ic = cardioIcon(c);
      return `<div class="workout-cell ${status} ${flair}" onclick="${openFn}('${c.id}')">
        <div class="wnum">${i + 1}</div>

    const hasContent = isGzcl ? enabledTierKeys(w).length > 0 : w.exercises.length > 0;

  const doneCount = list.filter(w => (w.t1 ? workoutCompletion(cycle, w) : mesoWorkoutCompletion(cycle, w)) === 'done').length;
  const withContentCount = list.filter(w => w.t1 ? enabledTierKeys(w).length > 0 : w.exercises.length > 0).length;
  return `<div class="workout-grid">${cells}</div>
    <div class="panel" style="margin-top:10px;">
      <div class="row">
        <span style="font-size:13px;color:var(--text-dim)">Logged this week</span>

// ================= TRAIN: MESO1 WORKOUT LOG =================
// MESO1 exercises carry no training max — like GZCL's T3 accessories, weight is
// whatever was last logged for that exercise, carried forward with any queued
// adjustments. Progression is driven by RIR (how many reps were left in the tank)
// against the exercise's target RIR, rather than an AMRAP-set rep count.
function mesoExHistoryBaseWeightLb(workoutId, exId, targetCycle) {
  for (let c = targetCycle - 1; c >= 1; c--) {
    const log = STATE.logs[logKey(c, workoutId)];
    const entry = log && log.entries[exId];
    if (entry && entry.sets && entry.sets[0] && entry.sets[0].weight !== '' && entry.sets[0].weight !== undefined) {
      return entry.sets[0].weight;
    }
  }
  return null;
}
function mesoExEffectiveWeightLb(workoutId, ex, cycle) {
  const base = mesoExHistoryBaseWeightLb(workoutId, ex.id, cycle);
  if (base === null) return null;
  const adjustments = Array.isArray(ex.adjustments) ? ex.adjustments : [];
  let total = base;
  adjustments.forEach(a => { if (a.fromCycle <= cycle) total += a.deltaLb; });
  return total;
}
function computeMesoSuggestion(entry, ex) {
  const logged = entry.sets.filter(s => s.reps !== '' && s.reps !== undefined);
  if (logged.length === 0) return { eligible: false, missed: false, note: 'Log your sets (reps + RIR) to get a suggestion.' };
  const withRir = logged.filter(s => s.rir !== '' && s.rir !== undefined && s.rir !== null);
  if (withRir.length === 0) return { eligible: false, missed: false, note: 'Log an RIR on at least one set to get a suggestion.' };
  const avgRIR = withRir.reduce((sum, s) => sum + Number(s.rir), 0) / withRir.length;
  const target = Number(ex.targetRIR) || 0;
  const diff = avgRIR - target;
  const avgRIRStr = fmt(avgRIR, 1);
  if (diff >= 1.5) {
    return { eligible: true, missed: false, avgRIR, note: `Averaged ${avgRIRStr} RIR vs a target of ${target} — sets felt easy. Consider adding weight next time.` };
  }
  if (diff <= -1) {
    return { eligible: false, missed: true, avgRIR, note: `Averaged ${avgRIRStr} RIR vs a target of ${target} — that ran hotter than planned. Hold this weight, or trim a set next time if it keeps happening.` };
  }
  return { eligible: false, missed: false, avgRIR, note: `Averaged ${avgRIRStr} RIR vs a target of ${target} — right on track. Hold this weight and rep range.` };
}
function renderMesoExerciseBlock(workout, cycle, log, ex) {
  const entryKey = ex.id;
  if (!log.entries[entryKey]) log.entries[entryKey] = { sets: [], applied: false, appliedDeltaLb: null, appliedAdjustmentId: null };
  const entry = log.entries[entryKey];
  if (entry.applied === undefined) entry.applied = false;
  while (entry.sets.length < ex.sets) entry.sets.push({ weight: '', reps: '', rir: '' });

  const effectiveLb = mesoExEffectiveWeightLb(workout.id, ex, cycle);
  const needsSeed = effectiveLb === null;
  if (needsSeed) {
    const anchorW = entry.sets[0] ? entry.sets[0].weight : '';
    for (let i = 1; i < entry.sets.length; i++) entry.sets[i].weight = anchorW;
  }

  const mColor = muscleColor(ex.muscle);
  const setTypeInfo = MESO_SET_TYPES[ex.setType] || MESO_SET_TYPES.straight;
  const isBand = ex.resType === 'band';
  const isBW = ex.resType === 'bodyweight';

  const setsHtml = entry.sets.map((s, i) => {
    const isSeedAnchor = needsSeed && i === 0;
    const isSeedMirror = needsSeed && i > 0;
    let wVal;
    if (isBand || isBW) {
      wVal = s.weight !== '' && s.weight !== undefined ? s.weight : '';
    } else if (isSeedMirror) {
      wVal = s.weight !== '' && s.weight !== undefined ? lbToDisplay(s.weight) : '';
    } else if (needsSeed) {
      wVal = s.weight !== '' && s.weight !== undefined ? lbToDisplay(s.weight) : '';
    } else {
      wVal = s.weight !== '' && s.weight !== undefined ? lbToDisplay(s.weight) : lbToDisplay(effectiveLb);
    }
    const wDisplay = (isBand || isBW) ? wVal : (wVal === '' ? '' : fmt(wVal, 1));
    const repsVal = s.reps !== '' && s.reps !== undefined ? s.reps : '';
    const rirVal = s.rir !== '' && s.rir !== undefined && s.rir !== null ? s.rir : '';
    return `<div>
      ${isSeedAnchor ? setLabelRow('SEED', 'var(--reset-text)', 2) : ''}
      <div class="set-row-meso">
        <div class="setnum">${i+1}</div>
        ${isBand
          ? `<input type="text" placeholder="band" value="${escapeHtml(String(wDisplay))}" onchange="updateMesoSet('${workout.id}','${entryKey}',${i},'weight',this.value)">`
          : isBW
          ? `<input type="text" placeholder="+/- wt" value="${escapeHtml(String(wDisplay))}" onchange="updateMesoSet('${workout.id}','${entryKey}',${i},'weight',this.value)">`
          : `<input type="number" inputmode="decimal" step="0.5" placeholder="wt" value="${wDisplay}"
              ${isSeedAnchor ? 'style="border-color:var(--reset-border); background:var(--reset-bg); font-weight:700;"' : ''}
              ${isSeedMirror ? 'readonly style="opacity:.65;"' : ''}
              onchange="updateMesoSet('${workout.id}','${entryKey}',${i},'weight',this.value)">`}
        <input type="number" inputmode="numeric" min="0" step="1" placeholder="reps" value="${repsVal}"
          onchange="updateMesoSet('${workout.id}','${entryKey}',${i},'reps',this.value)">
        <input type="number" inputmode="decimal" step="0.5" min="0" max="5" placeholder="RIR" value="${rirVal}"
          onchange="updateMesoSet('${workout.id}','${entryKey}',${i},'rir',this.value)">
        <div></div>
      </div>
    </div>`;
  }).join('');

  const sugg = computeMesoSuggestion(entry, ex);
  const displayedDelta = entry.applied ? entry.appliedDeltaLb : null;

  return `
    <div class="tier-block" ${mColor ? `style="border-left: 4px solid ${mColor};"` : ''}>
      <div class="tier-head" ${mColor ? `style="background:${hexToRgba(mColor, 0.14)};"` : ''}>
        <div>
          <div class="tname">${escapeHtml(ex.name || 'Untitled exercise')}</div>
          <div class="tmove">${setTypeInfo.label}${ex.muscle ? ` <span style="background:${mColor}; color:#1a1a1a; padding:1px 7px; border-radius:10px; font-size:10px; font-weight:700; margin-left:4px;">${ex.muscle}</span>` : ''}</div>
        </div>
      </div>
      <div class="tier-body">
        ${needsSeed && !isBand && !isBW
          ? `<div class="target-line" style="color:var(--reset-text); font-weight:600;">First time logging this — enter your working weight for Set 1; the rest will match it.</div>`
          : `<div class="target-line">Target: <span class="tv">${ex.sets}&times;${ex.repMin}-${ex.repMax}</span> @ RIR ${fmt(ex.targetRIR,1)}</div>`}
        <div class="set-row-meso" style="margin-bottom:8px; opacity:.6;">
          <div></div><div style="font-size:10px;color:var(--text-faint); font-weight:700;">WEIGHT</div><div style="font-size:10px;color:var(--text-faint); font-weight:700;">REPS</div><div style="font-size:10px;color:var(--text-faint); font-weight:700;">RIR</div><div></div>
        </div>
        ${setsHtml}
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 0;">
          <button class="btn btn-ghost btn-sm" onclick="addMesoSet('${workout.id}','${entryKey}')">+ ADD SET</button>
          ${entry.sets.length > 1 ? `<button class="btn btn-ghost btn-sm" style="color:var(--bad)" onclick="removeMesoSet('${workout.id}','${entryKey}',${entry.sets.length - 1})">&minus; REMOVE LAST SET</button>` : ''}
          ${nextRepeatableSetIndex(entry) >= 0 ? `<button class="btn btn-ghost btn-sm" onclick="repeatLastMesoSet('${workout.id}','${entryKey}')">${icon('repeat')} REPEAT LAST SET</button>` : ''}
        </div>
        ${entry.applied ? `
        <div class="suggestion-box applied">
          <div>
            <div class="sugtext">Weight change queued for next workout</div>
            <div class="sugval">${displayedDelta >= 0 ? '+' : ''}${fmt(lbToDisplay(displayedDelta),1)} ${weightUnitLabel()}</div>
          </div>
          <button class="btn btn-sm" style="background:var(--good); color:#0c1b12; border-color:var(--good);" onclick="undoMesoSuggestion('${workout.id}','${entryKey}')" title="Tap to undo">SET! (tap to undo)</button>
        </div>
        <div style="font-size:11px; color:var(--text-faint); margin-top:6px;">Locked in for next time — tap SET! to undo if you made a mistake.</div>`
        : sugg.eligible && !isBand && !isBW ? `
        <div class="suggestion-box">
          <div><div class="sugtext">${sugg.note}</div></div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="number" step="0.5" placeholder="lb" value="" id="mesosugg_${workout.id}_${entryKey}" style="width:64px;">
            <button class="btn btn-good btn-sm" onclick="applyMesoSuggestion('${workout.id}','${entryKey}')">APPLY</button>
          </div>
        </div>`
        : `<div style="font-size:11px; ${sugg.missed ? 'color:var(--bad); font-weight:600;' : 'color:var(--text-faint);'} margin-top:6px;">${sugg.note}</div>`}
      </div>
    </div>`;
}
function renderMesoWorkoutLog(workoutId) {
  const workout = getMesoWorkout(workoutId);
  const cycle = STATE.currentCycle;
  const log = getMesoLog(cycle, workoutId);

  const setVol = computeVolumeForCycle(cycle);
  const bumpedMuscles = new Set(workout.exercises.map(e => e.muscle).filter(Boolean));
  const volLine = bumpedMuscles.size > 0 ? `
    <div class="panel" style="margin-bottom:10px;">
      <div class="subtle-label" style="margin-bottom:6px;">THIS WEEK SO FAR</div>
      <div style="display:flex; flex-wrap:wrap; gap:8px 16px;">
        ${[...bumpedMuscles].map(m => {
          const lm = STATE.muscleLandmarks[m];
          const sets = (setVol.find(d => d.muscle === m) || {sets:0}).sets;
          const zone = !lm ? '' : (sets < lm.mev ? 'below MEV' : sets > lm.mrv ? 'over MRV' : sets >= lm.mavLo && sets <= lm.mavHi ? 'in MAV range' : 'above MEV');
          return `<span style="font-size:12px; color:var(--text-dim);">${m} <b class="mono" style="color:var(--text)">${sets}</b> sets${lm ? ` <span style="color:var(--text-faint);">(${zone})</span>` : ''}</span>`;
        }).join('')}
      </div>
    </div>` : '';

  let blocks = workout.exercises.map(ex => renderMesoExerciseBlock(workout, cycle, log, ex)).join('');
  if (!blocks) {
    blocks = `<div class="empty-state"><div class="big">${icon('lock')}</div>No exercises assigned to this slot yet.<br>Go to Setup &rarr; Workout Builder to configure it.</div>`;
  }

  return `
    <div class="screen">
      <div class="row" style="margin-bottom:6px;">
        <button class="btn btn-ghost btn-sm" onclick="backToGrid()">&#8249; BACK</button>
        <button class="btn btn-ghost btn-sm" onclick="clearMesoWorkoutLog('${workoutId}')" style="color:var(--bad)">CLEAR</button>
      </div>
      <div class="section-title" style="margin-top:6px;">${escapeHtml(workout.name)}</div>
      <div class="subtle-label">WEEK ${cycle} &middot; ${log.date || 'not dated'}</div>
      <label class="field" style="margin-top:10px;">
        <span class="lbl">Date</span>
        <input type="date" value="${log.date || todayStr()}" onchange="updateMesoLogDate('${workoutId}', this.value)">
      </label>
      <div class="divider"></div>
      ${volLine}
      ${blocks}
      <div class="divider"></div>
      <label class="field">
        <span class="lbl">Notes</span>
        <textarea placeholder="How did it feel? Anything to remember for next time..." onchange="updateMesoLogNotes('${workoutId}', this.value)">${escapeHtml(log.notes || '')}</textarea>
      </label>
    </div>`;
}
function updateMesoSet(workoutId, exId, idx, field, value) {
  const log = getMesoLog(STATE.currentCycle, workoutId);
  const entry = log.entries[exId];
  if (!entry.sets[idx]) entry.sets[idx] = { weight: '', reps: '', rir: '' };
  const workout = getMesoWorkout(workoutId);
  const ex = getMesoExercise(workout, exId);
  const isNumericWeight = ex && ex.resType !== 'band' && ex.resType !== 'bodyweight';
  let justFilledReps = false;
  if (field === 'weight') entry.sets[idx].weight = value === '' ? '' : (isNumericWeight ? displayToLb(value) : value);
  else if (field === 'reps') {
    const wasBlank = entry.sets[idx].reps === '' || entry.sets[idx].reps === undefined;
    entry.sets[idx].reps = sanitizeReps(value);
    justFilledReps = wasBlank && entry.sets[idx].reps !== '';
  }
  else entry.sets[idx].rir = value === '' ? '' : Number(value);
  saveState();
  // MESO exercises don't have superset pairings (that's a GZCL-only concept), so it's always
  // just this one exercise's own round that needs to be filled in.
  if (justFilledReps && restTimerSettings().autoStart) startRestTimer();
  render();
}
function repeatLastMesoSet(workoutId, exId) {
  const log = getMesoLog(STATE.currentCycle, workoutId);
  const entry = log.entries[exId];
  const nextIdx = nextRepeatableSetIndex(entry);
  if (nextIdx === -1) return;
  const src = entry.sets[nextIdx - 1];
  entry.sets[nextIdx].weight = src.weight;
  entry.sets[nextIdx].reps = src.reps;
  entry.sets[nextIdx].rir = src.rir;
  saveState();
  if (restTimerSettings().autoStart) startRestTimer();
  render();
}
function addMesoSet(workoutId, exId) {
  const log = getMesoLog(STATE.currentCycle, workoutId);
  log.entries[exId].sets.push({ weight: '', reps: '', rir: '' });
  saveState(); render();
}
function removeMesoSet(workoutId, exId, idx) {
  const log = getMesoLog(STATE.currentCycle, workoutId);
  log.entries[exId].sets.splice(idx, 1);
  saveState(); render();
}
function applyMesoSuggestion(workoutId, exId) {
  const log = getMesoLog(STATE.currentCycle, workoutId);
  const entry = log.entries[exId];
  if (entry.applied) return;
  const input = document.getElementById(`mesosugg_${workoutId}_${exId}`);
  const deltaLb = displayToLb(input.value || 0);
  const workout = getMesoWorkout(workoutId);
  const ex = getMesoExercise(workout, exId);
  if (!Array.isArray(ex.adjustments)) ex.adjustments = [];
  const adjId = uid();
  ex.adjustments.push({ id: adjId, fromCycle: STATE.currentCycle + 1, deltaLb });
  entry.applied = true;
  entry.appliedDeltaLb = deltaLb;
  entry.appliedAdjustmentId = adjId;
  saveState();
  showToast(`Queued: ${ex.name} +${fmt(lbToDisplay(deltaLb),1)} ${weightUnitLabel()} starting next workout`);
  render();
}
function undoMesoSuggestion(workoutId, exId) {
  const log = getMesoLog(STATE.currentCycle, workoutId);
  const entry = log.entries[exId];
  if (!entry.applied) return;
  const workout = getMesoWorkout(workoutId);
  const ex = getMesoExercise(workout, exId);
  if (Array.isArray(ex.adjustments) && entry.appliedAdjustmentId) {
    ex.adjustments = ex.adjustments.filter(a => a.id !== entry.appliedAdjustmentId);
  }
  entry.applied = false;
  entry.appliedDeltaLb = null;
  entry.appliedAdjustmentId = null;
  saveState();
  showToast('Undone — back to suggestion');
  render();
}
function updateMesoLogDate(workoutId, val) {
  const log = getMesoLog(STATE.currentCycle, workoutId);
  log.date = val;
  saveState();
}
function updateMesoLogNotes(workoutId, val) {
  const log = getMesoLog(STATE.currentCycle, workoutId);
  log.notes = val;
  saveState();
}
function clearMesoWorkoutLog(workoutId) {
  showConfirm('Clear all logged data for this workout this week?', () => {
    delete STATE.logs[logKey(STATE.currentCycle, workoutId)];
    saveState();
    render();
  });
}

// ================= TRAIN: WORKOUT LOG =================
function renderSingleExerciseBlock(workout, cycle, log, key) {
  if (key === 't1') {
    const tierKey = workout.t1.variant === 'ultra' ? 'ultra' : 't1';
    return renderTierBlock(workout, cycle, log, tierKey, workout.t1.categoryId);
  }
  if (key === 't2a' || key === 't2b' || key === 't2c') {
    return renderTierBlock(workout, cycle, log, key, workout[key].categoryId);
  }
  if (key.indexOf('t3_') === 0) {
    const idx = parseInt(key.split('_')[1], 10);
    return renderT3Block(workout, cycle, log, idx, workout.t3[idx].name);
  }
  return '';
}
function renderSupersetGroup(workout, cycle, log, keys, supersetNumber) {
  const showPrimary = hasMixedTiers(keys);
  const complete = isSupersetComplete(workout, cycle, log, keys);
  const members = keys.map((k, i) => `<div class="superset-member">${showPrimary && i === 0 ? '<div class="superset-primary-tag">PRIMARY</div>' : ''}${renderSingleExerciseBlock(workout, cycle, log, k)}</div>`).join('');
  return `
    <div class="superset-group ${complete ? 'superset-complete' : ''}">
      <div class="superset-label">SUPERSET ${supersetNumber}${complete ? ' <span class="superset-done-tag">&#10003; DONE</span>' : ''}</div>
      ${members}
    </div>`;
}
function renderWorkoutLog(workoutId) {
  const workout = getWorkout(workoutId);
  const cycle = STATE.currentCycle;
  const log = getLog(cycle, workoutId);
  reconcileExerciseOrder(workout);

  let tierBlocks = '';
  let supersetCounter = 0;
  workout.exerciseOrder.forEach(line => {
    if (line.length === 1) {
      tierBlocks += renderSingleExerciseBlock(workout, cycle, log, line[0]);
    } else {
      supersetCounter++;
      tierBlocks += renderSupersetGroup(workout, cycle, log, line, supersetCounter);
    }
  });

  if (!tierBlocks) {
    tierBlocks = `<div class="empty-state"><div class="big">${icon('lock')}</div>No movements assigned to this slot yet.<br>Go to Setup &rarr; Workout Builder to configure it.</div>`;
  }

  return `
    <div class="screen">
      <div class="row" style="margin-bottom:6px;">
        <button class="btn btn-ghost btn-sm" onclick="backToGrid()">&#8249; BACK</button>
        <button class="btn btn-ghost btn-sm" onclick="clearWorkoutLog('${workoutId}')" style="color:var(--bad)">CLEAR</button>
      </div>
      <div class="section-title" style="margin-top:6px;">${escapeHtml(workout.name)}</div>
      <div class="subtle-label">WEEK ${cycle} &middot; ${todayOrDate(log)}</div>
      <label class="field" style="margin-top:10px;">
        <span class="lbl">Date</span>
        <input type="date" id="logDate" value="${log.date || todayStr()}" onchange="updateLogDate('${workoutId}', this.value)">
      </label>
      <div class="divider"></div>
      ${tierBlocks}
      <div class="divider"></div>
      <label class="field">
        <span class="lbl">Notes</span>
        <textarea id="logNotes" placeholder="How did it feel? Anything to remember for next time..." onchange="updateLogNotes('${workoutId}', this.value)">${escapeHtml(log.notes || '')}</textarea>
      </label>
    </div>`;
}
function todayOrDate(log) { return log.date || 'not dated'; }

function renderTierBlock(workout, cycle, log, tierKey, categoryId) {
  const cat = getCategory(categoryId);
  const scheme = TIER_SCHEMES[tierKey];
  const entryKey = tierKey;
  const { stage: stageIdx, needsReset } = computeStageState(workout.id, entryKey, cycle);

  if (!log.entries[entryKey]) {
    log.entries[entryKey] = { sets: [], applied: false, appliedDeltaLb: null };
  }
  const entry = log.entries[entryKey];
  entry.stage = stageIdx; // stashed for reference/display only — computeStageState is authoritative
  if (entry.applied === undefined) entry.applied = false;
  const stageDef = scheme.stages[stageIdx];
  const targetLb = targetWeightLb(tierKey, categoryId, cycle);

  // ensure sets array length matches stageDef.sets
  while (entry.sets.length < stageDef.sets) entry.sets.push({ weight: '', reps: '' });
  entry.sets = entry.sets.slice(0, stageDef.sets);

  if (needsReset) {
    // Sets 2+ always mirror Set 1's weight in the actual data, not just on screen
    const anchorW = entry.sets[0].weight;
    for (let i = 1; i < entry.sets.length; i++) entry.sets[i].weight = anchorW;
  }

  const plates = scheme.stages.map((s, i) => `<div class="plate ${i === stageIdx ? 'active' : ''}">${i+1}</div>`).join('');

  const resetAnchorLb = needsReset ? entry.sets[0].weight : null;

  const setsHtml = entry.sets.map((s, i) => {
    const isLast = i === stageDef.sets - 1;
    const isAmrap = stageDef.amrapLast && isLast;
    const targetReps = stageDef.reps;
    const isResetAnchor = needsReset && i === 0;
    const isResetMirror = needsReset && i > 0;

    let wVal;
    if (isResetMirror) {
      wVal = resetAnchorLb !== '' && resetAnchorLb !== undefined && resetAnchorLb !== null ? lbToDisplay(resetAnchorLb) : '';
    } else if (needsReset) {
      wVal = s.weight !== '' && s.weight !== undefined ? lbToDisplay(s.weight) : '';
    } else {
      wVal = s.weight !== '' && s.weight !== undefined ? lbToDisplay(s.weight) : lbToDisplay(targetLb);
    }
    const repsVal = s.reps !== '' && s.reps !== undefined ? s.reps : '';
    let hitClass = '', hitMark = '&middot;';
    if (s.reps !== '' && s.reps !== undefined) {
      const r = Number(s.reps);
      if (r >= targetReps) { hitClass = 'hit'; hitMark = '&#10003;'; }
      else { hitClass = 'miss'; hitMark = '&#10007;'; }
    }
    return `<div>
      ${isResetAnchor ? setLabelRow('RESET', 'var(--reset-text)', 2) : (isAmrap ? setLabelRow('AMRAP', 'var(--accent)', 3) : '')}
      <div class="set-row">
        <div class="setnum">${i+1}</div>
        <input type="number" inputmode="decimal" step="0.5" placeholder="wt" value="${wVal === '' ? '' : fmt(wVal,1)}"
          ${isResetAnchor ? 'style="border-color:var(--reset-border); background:var(--reset-bg); font-weight:700;"' : ''}
          ${isResetMirror ? 'readonly style="opacity:.65;"' : ''}
          onchange="updateSet('${workout.id}','${entryKey}',${i},'weight',this.value)">
        <input type="number" inputmode="numeric" min="0" step="1" placeholder="${targetReps}${isAmrap ? '+' : ''}" value="${repsVal}"
          ${isAmrap ? 'style="border-color:var(--accent);"' : ''}
          onchange="updateSet('${workout.id}','${entryKey}',${i},'reps',this.value)">
        <div class="hit-mark ${hitClass}">${hitMark}</div>
      </div>
    </div>`;
  }).join('');

  const sugg = computeSuggestion(workout, tierKey, categoryId, entry, stageDef);
  const appliedClass = entry.applied ? 'applied' : '';
  const displayedDelta = entry.applied ? entry.appliedDeltaLb : sugg.lb;
  const tierField = tierKeyToField(tierKey);
  const muscle = cat && cat.tiers[tierField] ? cat.tiers[tierField].muscle : null;
  const mColor = muscleColor(muscle);
  const blockStyle = mColor ? `style="border-left: 4px solid ${mColor};"` : '';
  const headStyle = mColor ? `style="background:${hexToRgba(mColor, 0.14)};"` : '';
  const repeatIdx = nextRepeatableSetIndex(entry);

  return `
    <div class="tier-block" ${blockStyle}>
      <div class="tier-head" ${headStyle}>
        <div>
          <div class="tname">${escapeHtml(tierExerciseLabel(cat, tierField))}</div>
          <div class="tmove">${scheme.label}${muscle ? ` <span style="background:${mColor}; color:#1a1a1a; padding:1px 7px; border-radius:10px; font-size:10px; font-weight:700; margin-left:4px;">${muscle}</span>` : ''}</div>
        </div>
        <div class="plate-row">${plates}</div>
      </div>
      <div class="tier-body">
        ${needsReset
          ? `<div class="target-line" style="color:var(--reset-text); font-weight:600;">Reset triggered — missed Stage 3 last time. Enter a fresh working weight for Set 1; the rest will match it. Back to Stage 1: ${stageDef.sets}&times;${stageDef.reps}${stageDef.amrapLast ? ' (last set AMRAP)' : ''}</div>`
          : `<div class="target-line">Target: <span class="tv">${fmtWeight(targetLb)} ${weightUnitLabel()}</span> &middot; ${stageDef.sets}&times;${stageDef.reps}${stageDef.amrapLast ? ' (last set AMRAP)' : ''}${stageDef.testNote ? ' &mdash; ' + stageDef.testNote : ''}</div>`
        }
        <div class="set-row" style="margin-bottom:8px; opacity:.6;">
          <div></div><div style="font-size:10px;color:var(--text-faint); font-weight:700;">WEIGHT</div><div style="font-size:10px;color:var(--text-faint); font-weight:700;">REPS</div><div></div>
        </div>
        ${setsHtml}
        ${repeatIdx >= 0 ? `<div style="margin:2px 0 10px;"><button class="btn btn-ghost btn-sm" onclick="repeatLastSet('${workout.id}','${entryKey}')">${icon('repeat')} REPEAT LAST SET</button></div>` : ''}
        ${entry.applied ? `
        <div class="suggestion-box applied">
          <div>
            <div class="sugtext">TM change queued for next workout</div>
            <div class="sugval">${displayedDelta >= 0 ? '+' : ''}${fmt(lbToDisplay(displayedDelta),1)} ${weightUnitLabel()}</div>
          </div>
          <button class="btn btn-sm" style="background:var(--good); color:#0c1b12; border-color:var(--good);" onclick="undoSuggestion('${workout.id}','${entryKey}','${categoryId}')" title="Tap to undo">SET! (tap to undo)</button>
        </div>
        <div style="font-size:11px; color:var(--text-faint); margin-top:6px;">Locked in for next time — tap SET! to undo if you made a mistake.</div>`
        : sugg.eligible ? `
        <div class="suggestion-box">
          <div>
            <div class="sugtext">Suggested TM change (applies next workout)</div>
            <div class="sugval">+${fmt(lbToDisplay(sugg.lb),1)} ${weightUnitLabel()}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="number" step="0.5" value="${fmt(lbToDisplay(sugg.lb),1)}" id="sugg_${workout.id}_${entryKey}">
            <button class="btn btn-good btn-sm" onclick="applySuggestion('${workout.id}','${entryKey}','${categoryId}')">APPLY</button>
          </div>
        </div>
        <div style="font-size:11px; color:var(--text-faint); margin-top:6px;">${sugg.note}</div>`
        : sugg.missed ? `<div style="font-size:11px; color:var(--bad); margin-top:6px; font-weight:600;">${sugg.note}</div>`
        : `<div style="font-size:11px; color:var(--text-faint); margin-top:6px;">${sugg.note}</div>`}
      </div>
    </div>`;
}

function computeSuggestion(workout, tierKey, categoryId, entry, stageDef) {
  const cat = getCategory(categoryId);
  const lastSet = entry.sets[entry.sets.length - 1];
  const isAmrap = stageDef.amrapLast;
  const tierGroup = tierGroupOf(tierKey);

  if (!isAmrap || lastSet.reps === '' || lastSet.reps === undefined) {
    return { lb: 0, eligible: false, missed: false, note: 'Log your AMRAP set to get a suggestion.' };
  }
  const extra = Number(lastSet.reps) - stageDef.reps;
  if (extra < 0) {
    return { lb: 0, eligible: false, missed: true, note: `Missed the AMRAP target by ${-extra} rep(s) — next workout moves to the next stage.` };
  }
  const bonus = amrapSuggestionLb(extra, cat.lu, tierGroup);
  return { lb: bonus, eligible: true, missed: false, note: `${extra} rep(s) over target on the AMRAP set (${cat.lu} body, ${tierGroup}) → +${fmtLbShort(lbToDisplay(bonus))}${weightUnitLabel()} suggested.` };
}


// Accessories (T3) also progress through a 3-stage wave, but by TOTAL reps across all
// sets rather than a per-set target: Stage 1 = 60 total, Stage 2 = 45, Stage 3 = 30.
// Sets 1-4 are the "straight" sets; set 5+ are optional myorep bonus sets. Logging ANY
// reps in a myorep set signals the straight sets weren't enough to hit the total, so the
// following week's stage advances (or resets, if it happens again at Stage 3).
const T3_STAGE_TARGETS = [60, 45, 30];
function computeT3StageState(workoutId, entryKey, targetCycle) {
  let stage = 0;
  let needsReset = false;
  for (let c = 1; c < targetCycle; c++) {
    needsReset = false;
    const log = STATE.logs[logKey(c, workoutId)];
    const entry = log && log.entries[entryKey];
    const hasData = entry && entry.sets && entry.sets.some(s => s.reps !== '' && s.reps !== undefined);
    if (!hasData) continue;
    const usedMyo = entry.sets.slice(4).some(s => s.reps !== '' && s.reps !== undefined && Number(s.reps) > 0);
    if (usedMyo) {
      if (stage === T3_STAGE_TARGETS.length - 1) {
        needsReset = true;
        stage = 0;
      } else {
        stage = stage + 1;
      }
    }
  }
  return { stage, needsReset };
}

function renderT3Block(workout, cycle, log, idx, name) {
  const entryKey = 't3_' + idx;
  const t3def = workout.t3[idx];
  const t3Mcolor = muscleColor(t3def.muscle);
  if (!log.entries[entryKey]) {

  }
  const entry = log.entries[entryKey];
  if (entry.applied === undefined) entry.applied = false;

  const { stage: t3StageIdx, needsReset: stageNeedsReset } = computeT3StageState(workout.id, entryKey, cycle);
  const stageTarget = T3_STAGE_TARGETS[t3StageIdx];
  const effectiveLb = t3EffectiveWeightLb(workout, idx, entryKey, cycle);
  const needsSeed = effectiveLb === null || stageNeedsReset;

  if (needsSeed) {
    // mirror sets 2+ to set 1's weight, same pattern as the T1/T2 stage-3 reset
    const anchorW = entry.sets[0] ? entry.sets[0].weight : '';
    for (let i = 1; i < entry.sets.length; i++) entry.sets[i].weight = anchorW;
  }

  const totalReps = entry.sets.reduce((sum, s) => sum + (s.reps !== '' && s.reps !== undefined ? Number(s.reps) : 0), 0);
  const plates = T3_STAGE_TARGETS.map((tgt, i) => `<div class="plate ${i === t3StageIdx ? 'active' : ''}">${i+1}</div>`).join('');

  const setsHtml = entry.sets.map((s, i) => {
    const isSeedAnchor = needsSeed && i === 0;
    const isSeedMirror = needsSeed && i > 0;
    const isMyo = i >= 4;
    let wVal;
    if (isSeedMirror) {
      wVal = s.weight !== '' && s.weight !== undefined ? lbToDisplay(s.weight) : '';
    } else if (needsSeed) {
      wVal = s.weight !== '' && s.weight !== undefined ? lbToDisplay(s.weight) : '';
    } else {

    }

      ? setLabelRow(stageNeedsReset ? 'RESET' : '', 'var(--reset-text)', 2)

    // Per-set achievement indicator: green check on the set that first reached the
    // stage target within sets 1-2, yellow tilde if it took sets 3-4, red X on any
    // myorep set with reps entered. Non-achieving straight sets grey out (still fully
    // editable) once an achievement has been reached, to keep focus on what mattered.
    let hitMark = '&middot;', hitClass = '', rowGreyed = false;
    if (achievement.tier) {

          ${isSeedAnchor ? 'style="border-color:var(--reset-border); background:var(--reset-bg); font-weight:700;"' : ''}
          ${isSeedMirror ? 'readonly style="opacity:.65;"' : ''}
          onchange="updateSet('${workout.id}','${entryKey}',${i},'weight',this.value)">
        <input type="number" inputmode="numeric" min="0" step="1" placeholder="reps" value="${s.reps !== '' && s.reps !== undefined ? s.reps : ''}"
          ${isMyo ? 'style="border-color:var(--myo);"' : ''}

      </div>
    </div>`;
  }).join('');

  const t3sugg = computeT3Suggestion(entry, stageTarget);
  const t3appliedClass = entry.applied ? 'applied' : '';
  const t3displayedDelta = entry.applied ? entry.appliedDeltaLb : null;
  const usedMyoThisWeek = entry.sets.slice(4).some(s => s.reps !== '' && s.reps !== undefined && Number(s.reps) > 0);

  let suggestionHtml = '';
  if (entry.applied) {
    suggestionHtml = `
      <div class="suggestion-box ${t3appliedClass}">
        <div>
          <div class="sugtext">Weight change queued for next workout</div>
          <div class="sugval">${t3displayedDelta >= 0 ? '+' : ''}${fmt(lbToDisplay(t3displayedDelta),1)} ${weightUnitLabel()}</div>
        </div>
        <button class="btn btn-sm" style="background:var(--good); color:#0c1b12; border-color:var(--good);" onclick="undoT3Suggestion('${workout.id}','${entryKey}',${idx})" title="Tap to undo">SET! (tap to undo)</button>
      </div>

  } else if (usedMyoThisWeek) {

  } else {

  }

  return `

      <div class="tier-head" ${t3Mcolor ? `style="background:${hexToRgba(t3Mcolor, 0.14)};"` : ''}>
        <div>
          <div class="tname">${escapeHtml(name)}</div>
          <div class="tmove">Accessory${t3def.muscle ? ` <span style="background:${t3Mcolor}; color:#1a1a1a; padding:1px 7px; border-radius:10px; font-size:10px; font-weight:700; margin-left:4px;">${t3def.muscle}</span>` : ''}</div>
        </div>
        <div class="plate-row">${plates}</div>
      </div>
      <div class="tier-body">
        ${needsSeed ? `<div class="target-line" style="color:var(--reset-text); font-weight:600;">${stageNeedsReset ? 'Reset triggered — needed myoreps at Stage 3 last time. Enter a fresh working weight for Set 1; the rest will match it. Back to Stage 1.' : 'First time logging this — enter your working weight for Set 1; the rest will match it.'}</div>` : `<div class="target-line">Target: <span class="tv">${stageTarget}</span> total reps (Stage ${t3StageIdx + 1})</div>`}
        <div class="set-row" style="margin-bottom:8px; opacity:.6;">
          <div></div><div style="font-size:10px;color:var(--text-faint); font-weight:700;">WEIGHT</div><div style="font-size:10px;color:var(--text-faint); font-weight:700;">REPS</div><div></div>
        </div>
        ${setsHtml}
        <div style="margin: 2px 0 12px;">
          <div class="row" style="margin-bottom:4px;">
            <span style="font-size:11px; color:var(--text-dim); font-weight:600; letter-spacing:0.03em;">TOTAL LOGGED</span>
            <span class="mono" style="font-size:13px; font-weight:700;">${totalReps} / ${stageTarget}</span>
          </div>
          <div style="background:var(--surface2); border-radius:20px; height:8px; overflow:hidden; border:1px solid var(--border-soft);">
            <div style="width:${Math.min(100, Math.round(totalReps / stageTarget * 100))}%; height:100%; background:${totalReps >= stageTarget ? 'var(--good)' : 'var(--accent)'}; border-radius:20px;"></div>
          </div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" onclick="addT3Set('${workout.id}','${entryKey}')">+ ADD SET</button>
          ${entry.sets.length > 1 ? `<button class="btn btn-ghost btn-sm" style="color:var(--bad)" onclick="removeT3Set('${workout.id}','${entryKey}',${entry.sets.length - 1})">&minus; REMOVE LAST SET</button>` : ''}
          ${nextRepeatableSetIndex(entry) >= 0 ? `<button class="btn btn-ghost btn-sm" onclick="repeatLastSet('${workout.id}','${entryKey}')">${icon('repeat')} REPEAT LAST SET</button>` : ''}

}

// Achievement tier for a T3 accessory, based on which set the cumulative reps first
// hit the stage target within: 'green' if reached within sets 1-2, 'yellow' if it took
// sets 3-4, null if the straight sets alone never got there.
function computeT3Achievement(entry, stageTarget) {
  let cumulative = 0;
  let achievedAtIndex = -1;
  const straightSets = entry.sets.slice(0, 4);
  for (let i = 0; i < straightSets.length; i++) {
    const r = straightSets[i].reps;
    if (r === '' || r === undefined) continue;
    cumulative += Number(r);
    if (cumulative >= stageTarget) { achievedAtIndex = i; break; }
  }
  let tier = null;
  if (achievedAtIndex === 0 || achievedAtIndex === 1) tier = 'green';
  else if (achievedAtIndex === 2 || achievedAtIndex === 3) tier = 'yellow';
  return { tier, achievedAtIndex };
}
function computeT3Suggestion(entry, stageTarget) {
  const achievement = computeT3Achievement(entry, stageTarget);
  const usedMyo = entry.sets.slice(4).some(s => s.reps !== '' && s.reps !== undefined && Number(s.reps) > 0);
  // A green check (hit within the first 2 sets) always unlocks the prompt, even if
  // myoreps got filled in anyway — yellow (took 3-4 sets) still requires no myo use.
  const eligible = achievement.tier === 'green' || (achievement.tier === 'yellow' && !usedMyo);
  return { eligible, achievement };
}

// ---- Superset completion (for greying out a finished pairing) ----
function isExerciseComplete(workout, cycle, log, key) {
  if (key === 't1' || key === 't2a' || key === 't2b' || key === 't2c') {
    const entry = log.entries[key];
    if (!entry || !entry.sets || entry.sets.length === 0) return false;
    const lastSet = entry.sets[entry.sets.length - 1];
    return lastSet.reps !== '' && lastSet.reps !== undefined;
  }
  if (key.indexOf('t3_') === 0) {
    const entry = log.entries[key];
    if (!entry) return false;
    const { stage } = computeT3StageState(workout.id, key, cycle);
    const stageTarget = T3_STAGE_TARGETS[stage];
    const totalReps = entry.sets.reduce((sum, s) => sum + (s.reps !== '' && s.reps !== undefined ? Number(s.reps) : 0), 0);
    return totalReps >= stageTarget;
  }
  return false;
}
function isSupersetComplete(workout, cycle, log, keys) {
  return keys.every(k => isExerciseComplete(workout, cycle, log, k));
}

// ---- Rest auto-start (opt-in, off by default -- see Setup -> General): superset-aware, so a
// paired T1+T3 (etc.) only starts rest once every member of the pairing has logged its round,
// not the instant the first one is entered.
// Which superset line (from workout.exerciseOrder) entryKey belongs to -- just [entryKey] if it
// isn't paired with anything.
function supersetLineFor(workout, entryKey) {
  if (!workout || !Array.isArray(workout.exerciseOrder)) return [entryKey];
  const line = workout.exerciseOrder.find(l => l.includes(entryKey));
  return line || [entryKey];
}
// True once every member of entryKey's superset line has logged reps for round `idx`. A member
// with no set left at that index (it's already through all of its own sets) doesn't block the
// rest of the group from still triggering rest on their own later rounds.
function supersetRoundComplete(workout, log, entryKey, idx) {
  return supersetLineFor(workout, entryKey).every(k => {
    const entry = log.entries[k];
    if (!entry || !entry.sets[idx]) return true;
    return entry.sets[idx].reps !== '' && entry.sets[idx].reps !== undefined;
  });
}

// ---- Quick-add: repeat the last logged set's weight+reps (and RIR, for MESO1) into the next
// blank set, so identical straight sets don't need retyping every time.
function nextRepeatableSetIndex(entry) {
  if (!entry || !entry.sets || entry.sets.length < 2) return -1;
  let lastLoggedIdx = -1;
  for (let i = 0; i < entry.sets.length; i++) {
    if (entry.sets[i].reps !== '' && entry.sets[i].reps !== undefined) lastLoggedIdx = i;
  }
  if (lastLoggedIdx === -1) return -1;
  const nextIdx = lastLoggedIdx + 1;
  if (nextIdx >= entry.sets.length) return -1;
  if (entry.sets[nextIdx].reps !== '' && entry.sets[nextIdx].reps !== undefined) return -1;
  return nextIdx;
}
function repeatLastSet(workoutId, entryKey) {
  const log = getLog(STATE.currentCycle, workoutId);
  const entry = log.entries[entryKey];
  const nextIdx = nextRepeatableSetIndex(entry);
  if (nextIdx === -1) return;
  const src = entry.sets[nextIdx - 1];
  entry.sets[nextIdx].weight = src.weight;
  entry.sets[nextIdx].reps = src.reps;
  saveState();
  if (restTimerSettings().autoStart && supersetRoundComplete(getWorkout(workoutId), log, entryKey, nextIdx)) startRestTimer();
  render();
}

// ---- event handlers for train tab ----
function updateSet(workoutId, entryKey, idx, field, value) {
  const log = getLog(STATE.currentCycle, workoutId);
  const entry = log.entries[entryKey];
  if (!entry.sets[idx]) entry.sets[idx] = { weight: '', reps: '' };
  let justFilledReps = false;
  if (field === 'weight') entry.sets[idx].weight = value === '' ? '' : displayToLb(value);
  else {
    const wasBlank = entry.sets[idx].reps === '' || entry.sets[idx].reps === undefined;
    entry.sets[idx].reps = sanitizeReps(value);
    justFilledReps = wasBlank && entry.sets[idx].reps !== '';
  }
  saveState();
  if (justFilledReps && restTimerSettings().autoStart && supersetRoundComplete(getWorkout(workoutId), log, entryKey, idx)) startRestTimer();
  render();
}
function addT3Set(workoutId, entryKey) {
  const log = getLog(STATE.currentCycle, workoutId);
  log.entries[entryKey].sets.push({ weight: '', reps: '' });
  saveState(); render();
}
function removeT3Set(workoutId, entryKey, idx) {
  const log = getLog(STATE.currentCycle, workoutId);
  log.entries[entryKey].sets.splice(idx, 1);
  saveState(); render();
}
function applySuggestion(workoutId, entryKey, categoryId) {
  const log = getLog(STATE.currentCycle, workoutId);
  const entry = log.entries[entryKey];
  if (entry.applied) return; // guard against double-apply
  const input = document.getElementById(`sugg_${workoutId}_${entryKey}`);
  const deltaLb = displayToLb(input.value);
  const cat = getCategory(categoryId);
  const tierField = tierKeyToField(entryKey);
  const tier = cat.tiers[tierField];
  if (!Array.isArray(tier.adjustments)) tier.adjustments = [];
  const adjId = uid();
  // Queued for the cycle AFTER this one — never affects the workout it was earned in,
  // and can't be queued twice for the same logged entry.
  tier.adjustments.push({ id: adjId, fromCycle: STATE.currentCycle + 1, deltaLb });
  entry.applied = true;
  entry.appliedDeltaLb = deltaLb;
  entry.appliedAdjustmentId = adjId;
  saveState();
  showToast(`Queued: ${cat.name} ${tierField} +${fmt(lbToDisplay(deltaLb),1)} ${weightUnitLabel()} starting next workout`);
  render();
}
function undoSuggestion(workoutId, entryKey, categoryId) {
  const log = getLog(STATE.currentCycle, workoutId);
  const entry = log.entries[entryKey];
  if (!entry.applied) return;
  const cat = getCategory(categoryId);
  const tierField = tierKeyToField(entryKey);
  const tier = cat.tiers[tierField];
  if (Array.isArray(tier.adjustments) && entry.appliedAdjustmentId) {

  entry.appliedDeltaLb = null;
  entry.appliedAdjustmentId = null;
  saveState();

  render();
}
function applyT3Suggestion(workoutId, entryKey, t3idx) {

  entry.appliedDeltaLb = deltaLb;
  entry.appliedAdjustmentId = adjId;
  saveState();
  showToast(`Queued: ${t3def.name} +${fmt(lbToDisplay(deltaLb),1)} ${weightUnitLabel()} starting next workout`);
  render();
}
function undoT3Suggestion(workoutId, entryKey, t3idx) {
  const log = getLog(STATE.currentCycle, workoutId);
  const entry = log.entries[entryKey];
  if (!entry.applied) return;

  }
  entry.applied = false;
  entry.appliedDeltaLb = null;
  entry.appliedAdjustmentId = null;

  render();
}
function updateLogDate(workoutId, val) {
  const log = getLog(STATE.currentCycle, workoutId);
  log.date = val;
  saveState();
}
function updateLogNotes(workoutId, val) {
  const log = getLog(STATE.currentCycle, workoutId);
  log.notes = val;
  saveState();
}
function clearWorkoutLog(workoutId) {
  showConfirm('Clear all logged data for this workout this week?', () => {
    delete STATE.logs[logKey(STATE.currentCycle, workoutId)];

// Renders a small label (RESET / AMRAP / MYO) aligned exactly over one column of a
// .set-row grid, so it lines up correctly regardless of viewport width.
function setLabelRow(text, color, col) {
  if (!text) return '';
  const cells = [1,2,3,4].map(c => c === col
    ? `<div style="font-size:9px; font-weight:800; color:${color}; letter-spacing:0.05em;">${text}</div>`
    : '<div></div>');
  return `<div class="set-row" style="margin-bottom:2px;">${cells.join('')}</div>`;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function attachWorkoutLogHandlers() { /* using inline onclick/onchange, nothing extra needed */ }
// Setup is no longer one shared screen — each section with configurable parameters gets its
// own distinct page here, picked by SETUP_CONTEXT (see openSetup()). Only that section's own

function renderExerciseSetup() {

  else if (SETUP_SUBTAB === 'builder') body = renderWorkoutBuilder();

  // PLAN/MAXES/BUILDER/VIEW WORKOUTS/PLANNER/GENERAL switch here, as a subnav across the top of

function updateScheduleField(id, field, value) {

}

function roundMacro(n) { return Math.round((n || 0) * 10) / 10; }
// A sensible starting quantity per unit, so a freshly-added food shows a realistic amount
// rather than defaulting to the same raw number (e.g. 100) regardless of how big that unit is.
function defaultQtyForUnit(unit) {
  if (unit === 'oz' || unit === 'floz') return 4;
  if (unit === 'cup' || unit === 'tbsp' || unit === 'tsp' || unit === 'item') return 1;
  return 100; // g, mL, lb
}
function renderMealBuilderTab() {
  if (MEAL_BUILDER_DRAFT) return renderMealBuilderForm();

  `;
}
function startNewMeal() {

  HEALTH_SETUP_SUBTAB = 'builder';
  render();
}
function editMeal(id) {
  const meal = STATE.diet.meals.find(m => m.id === id);

  MEAL_BUILDER_DRAFT = { id: meal.id, name: meal.name, items: meal.items.map(it => Object.assign({}, it)), activeCategory: null, searchQuery: '' };

}

}

function toggleMealCategory(catId) {
  if (!MEAL_BUILDER_DRAFT) return;
  MEAL_BUILDER_DRAFT.activeCategory = MEAL_BUILDER_DRAFT.activeCategory === catId ? null : catId;

function addFoodToMeal(foodId) {

// Switching Metric/Imperial re-expresses every draft item's quantity in the new system's unit
// (converting the number so the actual amount stays the same) rather than just relabeling it —
// count-type items (eggs, capsules, cans...) are unaffected since they aren't system-dependent.
function setMealUnitSystem(sys) {
  if (sys === MEAL_UNIT_SYSTEM) return;
  MEAL_UNIT_SYSTEM = sys;
  if (!STATE.settings) STATE.settings = defaultState().settings;
  STATE.settings.mealUnitSystem = sys;
  saveState();
  if (MEAL_BUILDER_DRAFT) {
    MEAL_BUILDER_DRAFT.items.forEach(it => {
      const food = foodById(it.foodId);
      if (!food || food.unit === 'count') return;
      const qty = Number(it.qty) || 0;
      const oldFactor = food.unit === 'weight' ? (WEIGHT_TO_G[it.unit] || 1) : (VOLUME_TO_ML[it.unit] || 1);
      const baseAmount = qty * oldFactor;
      const newUnit = defaultMealUnitFor(food);
      const newFactor = food.unit === 'weight' ? (WEIGHT_TO_G[newUnit] || 1) : (VOLUME_TO_ML[newUnit] || 1);
      it.unit = newUnit;
      it.qty = Math.round((baseAmount / newFactor) * 100) / 100;
    });
  }
  render();
}
function saveMealDraft() {
  const draft = MEAL_BUILDER_DRAFT;
  if (!draft || !draft.items.length) return;
  const name = (draft.name || '').trim() || 'Untitled meal';
  const items = draft.items.map(it => ({ id: it.id, foodId: it.foodId, qty: Number(it.qty) || 0, unit: it.unit }));
  const now = new Date().toISOString();
  if (draft.id) {
    const meal = STATE.diet.meals.find(m => m.id === draft.id);
    if (meal) { meal.name = name; meal.items = items; meal.updatedAt = now; }
  } else {
    STATE.diet.meals.push({ id: uid(), name, items, createdAt: now, updatedAt: now });

  showToast('Meal saved');

}

let TDEE_CALC_OPEN = false;
function toggleTDEECalc() { TDEE_CALC_OPEN = !TDEE_CALC_OPEN; render(); }
// Exact replica of the "TDEE Tracker" calculator (BV4:CE6) from the source workbook:
// averages the Revised Harris-Benedict and Mifflin-St Jeor BMR estimates, then applies
// an activity multiplier. Weight in lb converts to kg via /2.2 (matches the sheet's own
// simplified factor rather than the more precise 2.20462, kept for fidelity).
const TDEE_ACTIVITY_MODIFIERS = { 'Sedentary': 1.2, 'Light': 1.375, 'Moderate': 1.55, 'High': 1.725, 'X-treme': 1.9 };
function computeTDEE(calc) {
  const weightKg = calc.weightUnit === 'Lb' ? calc.weight / 2.2 : calc.weight;
  const heightCm = calc.heightUnit === 'in' ? calc.height * 2.54 : calc.height;
  const age = calc.age;
  const hb = 10 * weightKg + 6.25 * heightCm - 5 * age + (calc.sex === 'M' ? 5 : -161);
  const msj = calc.sex === 'M'
    ? 13.397 * weightKg + 4.799 * heightCm - 5.677 * age + 88.362
    : 9.247 * weightKg + 3.098 * heightCm - 4.33 * age + 447.593;
  const avgBmrCal = (hb + msj) / 2;
  const modifier = TDEE_ACTIVITY_MODIFIERS[calc.activity] || 1;
  return Math.round(avgBmrCal * modifier);
}
function renderDietSetup() {
  const calc = STATE.diet.calc;

        <label class="field"><span class="lbl">Unit</span>
          <select onchange="updateTDEECalc('heightUnit', this.value)">
            <option value="in" ${calc.heightUnit==='in'?'selected':''}>in</option>
            <option value="cm" ${calc.heightUnit==='cm'?'selected':''}>cm</option>
          </select>
        </label>
      </div>
      <div class="field-row">
        <label class="field"><span class="lbl">Age</span><input type="number" value="${calc.age ?? ''}" onchange="updateTDEECalc('age', this.value)"></label>
        <label class="field"><span class="lbl">M/F</span>
          <select onchange="updateTDEECalc('sex', this.value)">
            <option value="M" ${calc.sex==='M'?'selected':''}>M</option>
            <option value="F" ${calc.sex==='F'?'selected':''}>F</option>
          </select>
        </label>
      </div>
      <label class="field" style="margin-bottom:10px;">
        <span class="lbl">Activity</span>
        <select onchange="updateTDEECalc('activity', this.value)">
          ${Object.keys(TDEE_ACTIVITY_MODIFIERS).map(a => `<option value="${a}" ${calc.activity===a?'selected':''}>${a}</option>`).join('')}
        </select>
      </label>
      ${result !== null ? `
        <div class="suggestion-box">

// ---- Macro Calculator: exact replica of the "Macro Calculator" (BV8:CE11) from the
// source workbook. Protein is always a direct g-per-lb(or kg) multiplier. Fat and Carb
// can each EITHER be a direct multiplier OR left blank to "Fill" — computed as whatever
// energy remains after protein and the other macro are accounted for. Exactly one of
// Fat/Carb may be left blank at a time (leaving both blank mirrors the sheet's own
// circular-reference situation, flagged there with "!!!").
function computeMacros(macro) {
  const isKj = macro.energyUnit === 'Kj';
  const proteinCalPerG = isKj ? 16.7 : 4;
  const carbCalPerG = isKj ? 16.7 : 4;
  const fatCalPerG = isKj ? 37.7 : 9;

  const proteinG = Math.round(macro.proteinPerUnit * macro.weight);
  const fatIsFill = macro.fatPerUnit === null || macro.fatPerUnit === undefined;
  const carbIsFill = macro.carbPerUnit === null || macro.carbPerUnit === undefined;

  if (fatIsFill && carbIsFill) {
    return { error: 'Only one of Fat or Carb can be left blank (Fill) at a time \u2014 set one of them to a fixed g/lb value.' };
  }

  let fatG, carbG;
  if (!fatIsFill && !carbIsFill) {
    fatG = Math.round(macro.fatPerUnit * macro.weight);
    carbG = Math.round(macro.carbPerUnit * macro.weight);
  } else if (fatIsFill) {
    carbG = Math.round(macro.carbPerUnit * macro.weight);
    fatG = Math.round((macro.energy - proteinG * proteinCalPerG - carbG * carbCalPerG) / fatCalPerG);
  } else {
    fatG = Math.round(macro.fatPerUnit * macro.weight);
    carbG = Math.round((macro.energy - proteinG * proteinCalPerG - fatG * fatCalPerG) / carbCalPerG);
  }
  return { proteinG, fatG, carbG };
}

async function exportData() {
  const json = JSON.stringify(STATE, null, 2);
  const filename = 'lifeman-backup-' + todayStr() + '.json';

  // Prefer the Claude Artifact runtime's native download prompt when present (harmless to keep
  // around in case this is ever re-embedded there), but this is no longer the primary path —
  // real hosting (GitHub Pages, etc.) never has window.claude, so the fallback below is what
  // actually runs day to day.
  try {
    const downloads = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('downloads') : null;
    if (downloads) {
      await downloads.save({ filename, data: json });
      showToast('Backup downloaded');
      return;
    }
  } catch (e) {
    if (e && e.code === 'declined') return; // user dismissed the prompt — no error toast
    // fall through to the portable path below rather than giving up
  }

  try {
    const blob = new Blob([json], { type: 'application/json' });
    // On iOS/mobile, the Web Share API (when it can share files) is the better experience —
    // it opens the native share sheet so the backup can go straight to Files, AirDrop, email,
    // etc., rather than landing wherever a same-tab download happens to go.
    if (navigator.canShare && navigator.share) {
      const file = new File([blob], filename, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        showToast('Backup shared');
        return;
      }
    }
    // Universal fallback: a temporary object URL + an <a download> click, which works in every
    // modern desktop browser and most mobile ones without needing any special API.
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('Backup downloaded');
  } catch (e) {
    if (e && e.name === 'AbortError') return; // user cancelled the share sheet — no error toast
    showToast('Could not save backup');
  }
}
function importData(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      STATE = Object.assign(defaultState(), data);
      saveState();
      showToast('Backup restored');
      render();
    } catch (err) {
      showToast('Could not read that file');
    }
  };
  reader.readAsText(file);
}

// runs right after signing in, specifically so a second device's existing local data doesn't
// get silently clobbered the moment it connects for the first time.
function pullThenSync() {
  if (!CLOUD_USER) return;
  CLOUD_SYNC_STATUS = 'syncing'; render();
  userDocRef().get().then((doc) => {
    if (doc.exists) {
      const remote = doc.data();
      const remoteUpdatedAt = remote.updatedAt || 0;
      const localUpdatedAt = STATE.updatedAt || 0;
      if (remoteUpdatedAt > localUpdatedAt) {
        const remoteState = JSON.parse(remote.data);
        STATE = Object.assign(defaultState(), remoteState);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); // skip saveState() here — avoid re-triggering a push of what we just pulled
        showToast('Synced — pulled your other device\'s newer data');
        render();
      } else if (localUpdatedAt > remoteUpdatedAt) {
        pushStateToCloud();
      }
    } else {
      pushStateToCloud(); // first-ever sync for this account — nothing remote yet
    }
    CLOUD_SYNC_STATUS = 'synced'; render();
  }).catch((e) => {

function addCategoryT2(id) {

}
function removeCategoryT2(id) {

function renderTierSetupRow(cat, tierKey) {

          <div style="font-size:9px; color:var(--text-faint); margin-bottom:3px;">WEIGHT (${weightUnitLabel()})</div>

            onchange="updateTierField('${cat.id}','${tierKey}','testWeightLb', displayToLb(this.value))">
        </div>
        <div>
          <div style="font-size:9px; color:var(--text-faint); margin-bottom:3px;">CONV %</div>
          <input type="number" step="0.001" value="${t.conv}" title="Auto-set from Test type — edit to fine-tune"
            onchange="updateTierField('${cat.id}','${tierKey}','conv', this.value)">
        </div>
      </div>
      ${tierGroup === 'T2' ? `
        <div>
          <div style="font-size:9px; color:var(--text-faint); margin-bottom:3px;">EXERCISE NAME (optional — can differ from ${escapeHtml(cat.name)}, e.g. Leg Press for a Squat-tracked T2)</div>
          <input type="text" placeholder="${escapeHtml(cat.name)}" value="${escapeHtml(t.exerciseName || '')}"
            onchange="updateTierField('${cat.id}','${tierKey}','exerciseName', this.value)">
        </div>` : ''}

}
function updateCategoryField(catId, field, val) {
  getCategory(catId)[field] = val;
  saveState(); render();
}
function toggleLU(catId) {
  const cat = getCategory(catId);
  cat.lu = cat.lu === 'lower' ? 'upper' : 'lower';
  saveState(); render();
}
function updateTierField(catId, tierKey, field, val) {
  const tier = getCategory(catId).tiers[tierKey];
  if (field === 'testWeightLb') {
    tier.testWeightLb = val;
  } else if (field === 'conv') {
    tier.conv = Number(val);
  } else if (field === 'testType') {
    tier.testType = val;
    const tierGroup = tierKey === 'T1' ? 'T1' : 'T2';
    tier.conv = convForTest(tierGroup, val); // auto-set conv from the RM/tier table
  } else {
    tier[field] = val;
  }
  tier.tmLb = computeTM(tier);
  saveState(); render();
}

const WEIGHTS_STYLES = ['P-Zero (GZCL)', 'Hypertrophy (RP Strength)', 'Free Entry'];
const CARDIO_STYLES = ['Time/Dist/Cal', 'Interval'];
let BUILDER_STYLE_PICKER_OPEN = false; // true while choosing a style for a brand-new weights/cardio workout

function renderWorkoutBuilder() {
  const list = workoutsByType(BUILDER_TYPE);
  if (!BUILDER_SELECTED[BUILDER_TYPE] || !list.find(w => w.id === BUILDER_SELECTED[BUILDER_TYPE])) {
    BUILDER_SELECTED[BUILDER_TYPE] = list.length ? list[0].id : null;
  }

  const typeToggle = `
    <div class="unit-toggle" style="margin-bottom:16px; width:100%; display:flex; flex-wrap:wrap; gap:6px;">
      <button style="flex:1 1 45%; ${BUILDER_TYPE==='weights' ? 'background:var(--accent); color:#17181b;' : ''}" onclick="setBuilderType('weights')"><span class="ic">${icon('exercise')}</span>WEIGHTS</button>
      <button style="flex:1 1 45%; ${BUILDER_TYPE==='cardio' ? 'background:var(--accent); color:#17181b;' : ''}" onclick="setBuilderType('cardio')"><span class="ic">${icon('progress')}</span>CARDIO</button>
      <button style="flex:1 1 45%; ${BUILDER_TYPE==='mobility' ? 'background:var(--accent); color:#17181b;' : ''}" onclick="setBuilderType('mobility')"><span class="ic">${icon('mobility')}</span>MOBILITY</button>
      <button style="flex:1 1 45%; ${BUILDER_TYPE==='warmup' ? 'background:var(--accent); color:#17181b;' : ''}" onclick="setBuilderType('warmup')"><span class="ic">${icon('warmup')}</span>WARMUP</button>
    </div>`;

  if (BUILDER_STYLE_PICKER_OPEN) {
    const styles = BUILDER_TYPE === 'weights' ? WEIGHTS_STYLES : CARDIO_STYLES;
    return typeToggle + `
      <div class="panel">
        <div class="subtle-label" style="margin-bottom:10px;">CHOOSE A STYLE</div>
        <div class="stack">
          ${styles.map(s => `<button class="btn btn-block" onclick="finishNewWorkout('${s}')">${escapeHtml(s)}</button>`).join('')}
        </div>
        <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="cancelNewWorkout()">CANCEL</button>
      </div>`;
  }

  // Cardio gets two extra one-tap buttons to bulk-create a whole program's tagged weekly
  // session set — see generateProgramWorkouts(). Safe to tap again later; it only tops up.
  const generateButtons = BUILDER_TYPE === 'cardio' ? `
    <div class="field-row" style="margin-bottom:14px;">
      <button class="btn btn-sm" style="flex:1;" onclick="generateProgramWorkouts('C25K')">+ C25K SET</button>
      <button class="btn btn-sm" style="flex:1;" onclick="generateProgramWorkouts('C2Triathlon')">+ C2TRIATHLON SET</button>
    </div>` : '';

  if (list.length === 0) {
    return typeToggle + generateButtons + `
      <div class="empty-state">
        <div class="big">${icon('lock')}</div>
        No ${WORKOUT_TYPE_LABELS[BUILDER_TYPE].toLowerCase()} workouts yet.
      </div>
      <div style="margin:14px 0 4px; text-align:center;">
        <button class="btn btn-primary" onclick="startNewWorkout()">+ NEW WORKOUT</button>
      </div>`;
  }

  const w = getWorkout(BUILDER_SELECTED[BUILDER_TYPE]);
  const header = `
    <div>
      ${typeToggle}
      ${generateButtons}
      <label class="field" style="margin-bottom:10px;">
        <span class="lbl">${WORKOUT_TYPE_LABELS[BUILDER_TYPE]}</span>
        <select onchange="setBuilderSelected(this.value)">
          ${list.map((wo, i) => `<option value="${wo.id}" ${wo.id === w.id ? 'selected' : ''}>${i + 1} — ${escapeHtml(wo.name)}</option>`).join('')}
        </select>
      </label>
      <div class="field-row" style="margin-bottom:4px;">
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="startNewWorkout()">+ SAVE / NEW WORKOUT</button>
        <button class="btn btn-ghost btn-sm" style="flex:1; color:var(--bad);" onclick="deleteWorkout('${w.id}')">&minus; DELETE WORKOUT</button>
      </div>
    </div>`;

  let editor;
  if (w.t1) editor = renderWeightWorkoutEditor(w);
  else if (w.type === 'cardio') editor = renderCardioWorkoutEditor(w);
  else editor = renderMesoWorkoutEditor(w); // Hypertrophy / Free Entry / Mobility / Warmup — all exercises[]-shaped

  return header + editor;
}
function setBuilderType(type) {
  BUILDER_TYPE = type;
  BUILDER_STYLE_PICKER_OPEN = false;
  render();
}
function setBuilderSelected(id) {
  BUILDER_SELECTED[BUILDER_TYPE] = id;

}
// "+ NEW WORKOUT" -- weights/cardio need a style choice first (it fixes the workout's shape for

  if (BUILDER_TYPE === 'weights' || BUILDER_TYPE === 'cardio') {

      <div style="font-size:11px; color:var(--text-faint); margin-top:4px;">Leave any field blank to skip it — the log screen only shows targets you've set here.</div>

// ---------------- EXERCISE PLANNER (Setup -> Exercise -> Planner) ----------------
// Weekday assignment for saved workouts of any type — mirrors Meal Plan's day-slot pattern
// (see addPlanMealSlot/renderMealPlanDay et al) but for STATE.exercisePlan. This sits alongside
// the cycle-based Train Grid rather than replacing it: Train Grid is still where you log a
// cycle's sets against training maxes; the Planner (plus Home's weekday card) is just "what's
// on the schedule today" convenience layered on top.
let EXPLAN_EXPANDED = {};
let EXPLAN_CLIPBOARD = null;
function addPlanWorkoutSlot(day) {
  if (!Array.isArray(STATE.exercisePlan[day])) STATE.exercisePlan[day] = [];
  STATE.exercisePlan[day].push({ id: uid(), workoutId: null });
  saveState(); render();
}
function removePlanWorkoutSlot(day, entryId) {
  STATE.exercisePlan[day] = (STATE.exercisePlan[day] || []).filter(e => e.id !== entryId);
  delete EXPLAN_EXPANDED[entryId];
  saveState(); render();
}
function setPlanWorkoutSlotWorkout(day, entryId, workoutId) {
  const entry = (STATE.exercisePlan[day] || []).find(e => e.id === entryId);
  if (!entry) return;
  entry.workoutId = workoutId || null;
  saveState(); render();
}
function copyDayWorkoutPlan(day) {
  const entries = (STATE.exercisePlan[day] || []).map(e => ({ workoutId: e.workoutId }));
  EXPLAN_CLIPBOARD = { day, entries };
  showToast(MEAL_PLAN_DAY_LABELS[day] + "'s workout plan copied");
  render();
}
function pasteDayWorkoutPlan(day) {
  if (!EXPLAN_CLIPBOARD) return;
  const doPaste = () => {
    STATE.exercisePlan[day] = EXPLAN_CLIPBOARD.entries.map(e => ({ id: uid(), workoutId: e.workoutId }));
    saveState();
    showToast('Pasted into ' + MEAL_PLAN_DAY_LABELS[day]);
    render();
  };
  if ((STATE.exercisePlan[day] || []).length) {
    showConfirm(`Replace ${MEAL_PLAN_DAY_LABELS[day]}'s existing workout plan with the copied one?`, doPaste);
  } else {
    doPaste();
  }
}
function renderExercisePlanTab() {
  const clipboardLabel = EXPLAN_CLIPBOARD
    ? `${MEAL_PLAN_DAY_LABELS[EXPLAN_CLIPBOARD.day]} (${EXPLAN_CLIPBOARD.entries.length} workout${EXPLAN_CLIPBOARD.entries.length === 1 ? '' : 's'})`
    : null;
  const hasProgram = programWorkouts('C25K').length > 0 || programWorkouts('C2Triathlon').length > 0;

let AUTOFILL_PICKER_OPEN = false;

function openAutoFillPicker() {

function renderAutoFillPicker() {
  const programs = [];
  if (programWorkouts('C25K').length) programs.push('C25K');
  if (programWorkouts('C2Triathlon').length) programs.push('C2Triathlon');
  const sessions = programWorkouts(AUTOFILL_PROGRAM);
  return `<div class="panel" style="margin-bottom:14px;">

function getLiveExercisesForWorkout(w) {
  const list = [];
  if (w.t1Revealed >= 1 && w.t1.categoryId) {
    const cat = getCategory(w.t1.categoryId);
    list.push({ key: 't1', label: 'T1 — ' + tierExerciseLabel(cat, 'T1') });
  }
  ['t2a','t2b','t2c'].forEach((tk, i) => {
    if (w.t2Revealed > i && w[tk].categoryId) {
      const cat = getCategory(w[tk].categoryId);
      const tierField = tk === 't2a' ? 'T2a' : tk === 't2b' ? 'T2b' : 'T2c';
      list.push({ key: tk, label: tk.toUpperCase() + ' — ' + tierExerciseLabel(cat, tierField) });
    }
  });
  w.t3.slice(0, w.t3Revealed).forEach((t, i) => {
    if (t.name) {
      list.push({ key: 't3_' + i, label: 'T3' + String.fromCharCode(97 + i).toUpperCase() + ' — ' + t.name });
    }
  });
  return list;
}
// ---- Exercise Order / Supersets: a single ordered list of "lines"; a line with one
// key is a standalone exercise, a line with 2+ keys is a superset (left-to-right order
// within the line = the superset's internal order). Reconciled against the live
// exercise set on every read so it self-heals as exercises are added/removed elsewhere.
function migrateExerciseOrder(w) {
  if (Array.isArray(w.exerciseOrder)) return; // already on the new model
  const live = getLiveExercisesForWorkout(w);
  const liveKeys = live.map(le => le.key);
  if (w.supersets && Array.isArray(w.supersets)) {
    const membership = {};
    w.supersets.forEach((ss, si) => { (ss.exercises || []).forEach(k => { if (k) membership[k] = si; }); });
    const lines = [];
    const done = new Set();
    liveKeys.forEach(key => {
      const si = membership[key];
      if (si !== undefined) {
        if (done.has(si)) return;
        done.add(si);
        const members = w.supersets[si].exercises.filter(Boolean).filter(k => liveKeys.includes(k));
        if (members.length) lines.push(members);
      } else {
        lines.push([key]);
      }
    });
    w.exerciseOrder = lines;
    delete w.supersets;
  } else {
    w.exerciseOrder = liveKeys.map(k => [k]);
  }
}
// Superset ordering rule: whichever exercise belongs to the lowest tier group present
// (T1 < T2 < T3) must occupy the front of the line. Ties (e.g. two T2s, or an all-T3
// group) are left exactly as the user arranged them — only the front slot is enforced.
function exerciseTierPriority(key) {
  if (key === 't1') return 1;
  if (key === 't2a' || key === 't2b' || key === 't2c') return 2;
  return 3; // t3_*
}
function hasMixedTiers(line) {
  return new Set(line.map(exerciseTierPriority)).size > 1;
}
function normalizeSupersetOrder(line) {
  if (line.length < 2) return line;
  const minPriority = Math.min(...line.map(exerciseTierPriority));
  if (exerciseTierPriority(line[0]) === minPriority) return line; // front slot already valid
  const idx = line.findIndex(k => exerciseTierPriority(k) === minPriority);
  const newLine = line.slice();
  const [item] = newLine.splice(idx, 1);
  newLine.unshift(item);
  return newLine;
}
function reconcileExerciseOrder(w) {
  if (!Array.isArray(w.exerciseOrder)) migrateExerciseOrder(w);
  const live = getLiveExercisesForWorkout(w);
  const liveKeys = live.map(le => le.key);
  const liveSet = new Set(liveKeys);
  w.exerciseOrder = w.exerciseOrder
    .map(line => line.filter(k => liveSet.has(k)))
    .filter(line => line.length > 0)
    .map(line => normalizeSupersetOrder(line));
  const present = new Set();
  w.exerciseOrder.forEach(line => line.forEach(k => present.add(k)));
  liveKeys.forEach(k => { if (!present.has(k)) w.exerciseOrder.push([k]); });
}
function resolveExerciseInfo(w, key) {
  if (key === 't1') {
    const cat = getCategory(w.t1.categoryId);
    return { tierLabel: 'T1', name: tierExerciseLabel(cat, 'T1'), color: cat ? muscleColor(cat.tiers.T1.muscle) : null };
  }
  if (key === 't2a' || key === 't2b' || key === 't2c') {
    const tierField = key === 't2a' ? 'T2a' : key === 't2b' ? 'T2b' : 'T2c';
    const cat = getCategory(w[key].categoryId);
    return { tierLabel: key.toUpperCase(), name: tierExerciseLabel(cat, tierField), color: cat ? muscleColor(cat.tiers[tierField].muscle) : null };
  }
  if (key.indexOf('t3_') === 0) {
    const idx = parseInt(key.split('_')[1], 10);
    const t = w.t3[idx];
    return { tierLabel: 'T3' + String.fromCharCode(97 + idx).toUpperCase(), name: t.name, color: muscleColor(t.muscle) };
  }
  return { tierLabel: '', name: '', color: null };
}
function renderSupersetsSection(w) {
  reconcileExerciseOrder(w);

  return `<div class="order-line">${chips}</div>`;
}
function renderExerciseChip(workoutId, key, info, isPrimary) {
  return `<div class="exercise-chip" data-exercise-key="${key}" onpointerdown="startChipDrag('${workoutId}','${key}',event,this)" style="border-left: 4px solid ${info.color || 'var(--border)'};">

function renderDropZone(workoutId, anchorKey) {
  return `<div class="order-dropzone" data-anchor-key="${anchorKey === null ? '' : anchorKey}"></div>`;

function removeKeyFromExerciseOrder(w, key) {
  for (let i = 0; i < w.exerciseOrder.length; i++) {
    const idx = w.exerciseOrder[i].indexOf(key);
    if (idx !== -1) {
      w.exerciseOrder[i].splice(idx, 1);
      if (w.exerciseOrder[i].length === 0) w.exerciseOrder.splice(i, 1);
      return;
    }

}
// Drop directly onto another chip: pulls the dragged exercise out of wherever it
// currently is and inserts it immediately after the target chip — same operation
// whether that's a merge into a different line (creating/extending a superset) or a
// reorder within the dragged chip's own line (works even when dragging the exercise
// that's currently first, since the target is always a *different* chip).
function commitMergeAfter(workoutId, targetKey, draggedKey) {
  const w = getWorkout(workoutId);
  if (!draggedKey || draggedKey === targetKey) { render(); return; }
  removeKeyFromExerciseOrder(w, draggedKey);
  const li = w.exerciseOrder.findIndex(line => line.includes(targetKey));
  if (li !== -1) {
    const line = w.exerciseOrder[li];
    line.splice(line.indexOf(targetKey) + 1, 0, draggedKey);
  } else {
    w.exerciseOrder.push([draggedKey]);
  }
  saveState(); render();
}
// Drop into a between-lines gap: inserts the dragged exercise as its own new
// standalone line at that position. anchorKey identifies "insert before the line
// that currently starts with this key" — captured at render time, so it can end up
// being the dragged key's own line (e.g. dragging an exercise out to just above the
// superset it's currently the first exercise of). Insertion position is resolved
// *before* removing the dragged key so that self-referencing anchor doesn't vanish
// out from under itself, then adjusted for any index shift the removal causes.
function commitDropBefore(workoutId, anchorKey, draggedKey) {
  const w = getWorkout(workoutId);
  if (!draggedKey) { render(); return; }

  let insertIndex;
  if (anchorKey === null || anchorKey === '') {
    insertIndex = w.exerciseOrder.length;
  } else {
    insertIndex = w.exerciseOrder.findIndex(line => line.includes(anchorKey));
    if (insertIndex === -1) insertIndex = w.exerciseOrder.length;
  }

  const draggedLineIndex = w.exerciseOrder.findIndex(line => line.includes(draggedKey));
  const draggedLineWillVanish = draggedLineIndex !== -1 && w.exerciseOrder[draggedLineIndex].length === 1;

  removeKeyFromExerciseOrder(w, draggedKey);

  if (draggedLineWillVanish && draggedLineIndex < insertIndex) insertIndex--;
  w.exerciseOrder.splice(Math.max(0, Math.min(insertIndex, w.exerciseOrder.length)), 0, [draggedKey]);
  saveState(); render();
}

// ---- Custom pointer-based drag (native HTML5 drag-and-drop is unreliable on mobile
// touch — fights with text selection and page scroll, and has no edge auto-scroll) ----
let CHIP_DRAG = null; // { workoutId, key, ghostEl, offsetX, offsetY, currentTarget, moved, scrollTimer }
const CHIP_DRAG_THRESHOLD = 8; // px of movement before a press counts as a drag, not a tap

function startChipDrag(workoutId, key, evt, chipEl) {
  evt.preventDefault();
  const rect = chipEl.getBoundingClientRect();
  const ghost = chipEl.cloneNode(true);
  ghost.className = 'exercise-chip exercise-chip-ghost';
  ghost.style.position = 'fixed';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.removeAttribute('onpointerdown');
  document.body.appendChild(ghost);

  chipEl.classList.add('exercise-chip-dragging');
  try { chipEl.setPointerCapture(evt.pointerId); } catch (e) {}

  CHIP_DRAG = {
    workoutId, key, ghostEl: ghost, sourceEl: chipEl,
    startX: evt.clientX, startY: evt.clientY,
    offsetX: evt.clientX - rect.left, offsetY: evt.clientY - rect.top,
    currentTarget: null, moved: false, scrollDir: 0,
  };

  chipEl.addEventListener('pointermove', onChipDragMove);
  chipEl.addEventListener('pointerup', onChipDragEnd);
  chipEl.addEventListener('pointercancel', onChipDragEnd);
  chipDragScrollTick();
}
function onChipDragMove(evt) {
  if (!CHIP_DRAG) return;
  evt.preventDefault();
  const dx = evt.clientX - CHIP_DRAG.startX, dy = evt.clientY - CHIP_DRAG.startY;
  if (!CHIP_DRAG.moved && Math.sqrt(dx*dx + dy*dy) > CHIP_DRAG_THRESHOLD) CHIP_DRAG.moved = true;

  CHIP_DRAG.ghostEl.style.left = (evt.clientX - CHIP_DRAG.offsetX) + 'px';
  CHIP_DRAG.ghostEl.style.top = (evt.clientY - CHIP_DRAG.offsetY) + 'px';

  // auto-scroll near top/bottom viewport edges while dragging
  const edge = 70;
  if (evt.clientY < edge) CHIP_DRAG.scrollDir = -1;
  else if (evt.clientY > window.innerHeight - edge) CHIP_DRAG.scrollDir = 1;
  else CHIP_DRAG.scrollDir = 0;

  CHIP_DRAG.ghostEl.style.display = 'none';
  const el = document.elementFromPoint(evt.clientX, evt.clientY);
  CHIP_DRAG.ghostEl.style.display = '';
  const target = el ? el.closest('.exercise-chip, .order-dropzone') : null;
  if (CHIP_DRAG.currentTarget && CHIP_DRAG.currentTarget !== target) {
    CHIP_DRAG.currentTarget.classList.remove('drop-target-active');
  }
  if (target) target.classList.add('drop-target-active');
  CHIP_DRAG.currentTarget = target;
}
function chipDragScrollTick() {
  if (!CHIP_DRAG) return;
  if (CHIP_DRAG.scrollDir) window.scrollBy(0, CHIP_DRAG.scrollDir * 14);
  requestAnimationFrame(chipDragScrollTick);
}
function onChipDragEnd(evt) {
  if (!CHIP_DRAG) return;
  const { workoutId, key, ghostEl, sourceEl, currentTarget, moved } = CHIP_DRAG;
  sourceEl.removeEventListener('pointermove', onChipDragMove);
  sourceEl.removeEventListener('pointerup', onChipDragEnd);
  sourceEl.removeEventListener('pointercancel', onChipDragEnd);
  sourceEl.classList.remove('exercise-chip-dragging');
  if (currentTarget) currentTarget.classList.remove('drop-target-active');
  ghostEl.remove();
  CHIP_DRAG = null;

  if (!moved || !currentTarget) { return; } // simple tap, or dropped outside any target — no-op
  if (currentTarget.classList.contains('exercise-chip')) {
    commitMergeAfter(workoutId, currentTarget.getAttribute('data-exercise-key'), key);
  } else {
    const anchorKey = currentTarget.getAttribute('data-anchor-key');
    commitDropBefore(workoutId, anchorKey === '' ? null : anchorKey, key);
  }
}

function renderVolume() {

  if (VOLUME_CYCLE > STATE.meso.cycles) VOLUME_CYCLE = STATE.meso.cycles;

  const data = computeVolumeForCycle(VOLUME_CYCLE);
  const maxSets = Math.max(1, ...data.map(d => d.sets));
  const anyTagged = workoutsByType('weights').some(w => Array.isArray(w.exercises) ? w.exercises.some(ex => ex.muscle) : w.t3.some(t => t.muscle))
    || STATE.categories.some(c => Object.values(c.tiers).some(t => t.muscle));

  const bars = data.map(d => {
    const barColor = muscleColor(d.muscle) || 'var(--accent)';
    const lm = STATE.muscleLandmarks[d.muscle];
    let trackStyle, marker = '', zoneLabel = '';
    if (lm) {
      const scale = Math.max(d.sets, lm.mrv, 1) * 1.1;
      const p = v => Math.min(100, (v / scale * 100)).toFixed(1);
      trackStyle = `background: linear-gradient(to right,
        var(--bad-soft) 0%, var(--bad-soft) ${p(lm.mev)}%,
        var(--surface2) ${p(lm.mev)}%, var(--surface2) ${p(lm.mavLo)}%,

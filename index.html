        var(--surface2) ${p(lm.mavHi)}%, var(--surface2) ${p(lm.mrv)}%,
        var(--bad-soft) ${p(lm.mrv)}%, var(--bad-soft) 100%);`;
      marker = `<div style="position:absolute; left:${p(d.sets)}%; top:-2px; bottom:-2px; width:3px; margin-left:-1.5px; background:${barColor}; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,0.25);"></div>`;
      zoneLabel = `<div style="font-size:10px; color:var(--text-faint); margin-top:3px;">MEV ${lm.mev} &middot; MAV ${lm.mavLo}-${lm.mavHi} &middot; MRV ${lm.mrv}</div>`;
    }
    return `
    <div style="margin-bottom:${lm ? 16 : 12}px;">
      <div class="row" style="margin-bottom:4px;">
        <div style="display:flex; align-items:center; gap:6px;">
          <div style="width:10px; height:10px; border-radius:50%; background:${barColor}; border:1px solid rgba(0,0,0,0.2);"></div>
          <span style="font-size:13px; font-weight:600;">${d.muscle}</span>
        </div>
        <span class="mono" style="font-size:13px; font-weight:700;">${d.sets} ${d.sets === 1 ? 'set' : 'sets'}</span>
      </div>
      <div style="position:relative; ${lm ? trackStyle : 'background:var(--surface2);'} border-radius:20px; height:10px; overflow:hidden; border:1px solid var(--border-soft);">
        ${lm ? marker : `<div style="width:${d.sets === 0 ? 0 : (d.sets / maxSets * 100).toFixed(0)}%; height:100%; background:${barColor}; border-radius:20px;"></div>`}
      </div>
      ${zoneLabel}
    </div>`;
  }).join('');

  return `
    <div class="week-selector">
      <div>
        <div class="subtle-label">SETS PER MUSCLE GROUP</div>
        <div class="cycle-label">WEEK ${VOLUME_CYCLE} <span style="color:var(--text-faint); font-size:16px;">/ ${STATE.meso.cycles}</span></div>
      </div>

      </div>

    <div class="panel">
      ${bars}

  `;

function anchorMinutes(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;

function fmtBlockTime(block) {
  if (block.start && block.end && block.start !== block.end) return fmtReminderTime(block.start) + '-' + fmtReminderTime(block.end);
  return fmtReminderTime(block.start || block.end);
}
// Which built schedule (Schedule -> Setup -> Schedule Builder) is toggled on for a given date's
// weekday, if any. If more than one somehow overlaps the same day, the first match wins.
function scheduleForDate(dateObj) {
  const weekday = dateObj.getDay(); // 0=Sun..6=Sat, matches Date#getDay()
  return STATE.life.schedules.find(s => Array.isArray(s.days) && s.days.includes(weekday)) || null;
}
// Today's schedule = the fixed daily anchors (same every day, edited under Set Anchors) merged
// with whichever schedule applies to today's weekday — its Wake-Up/Bed Time boundaries and
// custom activities layer in alongside the anchors, all sorted into one chronological list. With
// no matching schedule, anchors alone still show — exactly what "Today's anchors" always looked
// like before Schedule Builder existed.
function scheduleBlocksForDate(dateObj) {
  const sched = scheduleForDate(dateObj);
  const blocks = STATE.life.anchors.map(a => ({ id: 'anchor:' + a.id, start: a.start, end: a.end, label: a.label, detail: a.detail, kind: 'anchor', anchorId: a.id }));
  if (sched) {
    if (sched.wakeStart && sched.wakeEnd) blocks.push({ id: 'wake:' + sched.id, start: sched.wakeStart, end: sched.wakeEnd, label: 'Wake-Up', detail: '', kind: 'wake' });
    if (sched.bedStart && sched.bedEnd) blocks.push({ id: 'bed:' + sched.id, start: sched.bedStart, end: sched.bedEnd, label: 'Bed Time', detail: '', kind: 'bed' });
    (sched.activities || []).forEach(act => {
      if (!act.start) return;
      blocks.push({ id: 'act:' + act.id, start: act.start, end: act.end || act.start, label: act.title || 'Untitled activity', detail: act.description || '', kind: 'activity' });
    });
  }
  blocks.sort((x, y) => anchorMinutes(x.start) - anchorMinutes(y.start));
  return { schedule: sched, blocks };
}
function currentScheduleBlock() {
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const { blocks } = scheduleBlocksForDate(new Date());
  for (const b of blocks) {
    const s = anchorMinutes(b.start);
    const e = anchorMinutes(b.end);
    if (nowMin >= s && nowMin < e) return b;
  }
  return null;
}

// ---- Custom pointer-based drag for Home's Edit mode — same ghost-clone/pointer-capture
// mechanism as Exercise's superset drag (startChipDrag et al.), simplified to plain linear
// reordering (drop onto another item = move before it) since there's no merge/superset concept
// here, just two independent ordered lists (sections, boxes) that never mix with each other.
let HOME_DRAG = null; // { listKey, id, ghostEl, sourceEl, startX, startY, offsetX, offsetY, currentTarget, moved, scrollDir }
function startHomeDrag(listKey, id, evt, el) {
  if (!HOME_EDIT_MODE) return;
  if (evt.target.closest('.home-edit-x')) return; // let the X's own click through — don't capture the pointer or preventDefault over it
  evt.preventDefault();
  const rect = el.getBoundingClientRect();
  const ghost = el.cloneNode(true);
  ghost.className = el.className + ' home-drag-ghost';
  ghost.style.position = 'fixed';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.removeAttribute('onpointerdown');
  document.body.appendChild(ghost);
  el.classList.add('home-drag-source');
  try { el.setPointerCapture(evt.pointerId); } catch (e) {}
  HOME_DRAG = { listKey, id, ghostEl: ghost, sourceEl: el, startX: evt.clientX, startY: evt.clientY, offsetX: evt.clientX - rect.left, offsetY: evt.clientY - rect.top, currentTarget: null, moved: false, scrollDir: 0 };
  el.addEventListener('pointermove', onHomeDragMove);
  el.addEventListener('pointerup', onHomeDragEnd);
  el.addEventListener('pointercancel', onHomeDragEnd);
  homeDragScrollTick();
}
function onHomeDragMove(evt) {
  if (!HOME_DRAG) return;
  evt.preventDefault();
  const dx = evt.clientX - HOME_DRAG.startX, dy = evt.clientY - HOME_DRAG.startY;
  if (!HOME_DRAG.moved && Math.sqrt(dx * dx + dy * dy) > 8) HOME_DRAG.moved = true;
  HOME_DRAG.ghostEl.style.left = (evt.clientX - HOME_DRAG.offsetX) + 'px';
  HOME_DRAG.ghostEl.style.top = (evt.clientY - HOME_DRAG.offsetY) + 'px';
  const edge = 70;
  if (evt.clientY < edge) HOME_DRAG.scrollDir = -1;
  else if (evt.clientY > window.innerHeight - edge) HOME_DRAG.scrollDir = 1;
  else HOME_DRAG.scrollDir = 0;
  HOME_DRAG.ghostEl.style.display = 'none';
  const el = document.elementFromPoint(evt.clientX, evt.clientY);
  HOME_DRAG.ghostEl.style.display = '';
  const hit = el ? el.closest('[data-home-drag-id]') : null;
  const valid = hit && hit.getAttribute('data-home-drag-list') === HOME_DRAG.listKey && hit.getAttribute('data-home-drag-id') !== HOME_DRAG.id ? hit : null;

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
let CAL_MONTH = null;         // {year, month} — 0-indexed month, lazily set to the current month
let CAL_SELECTED_DATE = null; // 'YYYY-MM-DD', lazily set to today
let REMINDER_FORM_OPEN = false;
function ensureCalState() {
  if (!CAL_MONTH) { const d = new Date(); CAL_MONTH = { year: d.getFullYear(), month: d.getMonth() }; }
  if (!CAL_SELECTED_DATE) CAL_SELECTED_DATE = todayStr();
}
function calGoToMonth(delta) {
  ensureCalState();
  let m = CAL_MONTH.month + delta, y = CAL_MONTH.year;
  if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
  CAL_MONTH = { year: y, month: m };
  render();
}
function calSelectDay(dateStr) {
  CAL_SELECTED_DATE = dateStr;
  REMINDER_FORM_OPEN = false;
  render();
}
function dateKey(y, m, d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function remindersOn(dateStr) {
  return STATE.reminders.filter(r => r.date === dateStr).sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
}
function fmtReminderTime(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  const period = h >= 12 ? 'pm' : 'am';
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2,'0')}${period}`;
}
function renderScheduleCalendar() {
  ensureCalState();
  const { year, month } = CAL_MONTH;
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay(); // 0 = Sun
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = todayStr();
  const weekdayHeaders = ['S','M','T','W','T','F','S'].map(w => `<div class="cal-weekday">${w}</div>`).join('');
  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell cal-cell-blank"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dStr = dateKey(year, month, d);
    const has = remindersOn(dStr).length > 0;
    const isToday = dStr === today;
    const isSelected = dStr === CAL_SELECTED_DATE;
    cells += `<button class="cal-cell ${isToday?'cal-cell-today':''} ${isSelected?'cal-cell-selected':''}" onclick="calSelectDay('${dStr}')">
      <span class="cal-daynum">${d}</span>
      ${has ? '<span class="cal-dot"></span>' : ''}
    </button>`;
  }
  return `
    <div class="week-selector" style="margin-bottom:10px;">
      <div class="cycle-label" style="font-size:20px;">${MONTH_NAMES[month]} ${year}</div>
      <div class="cycle-btns">
        <button onclick="calGoToMonth(-1)">&#8249;</button>
        <button onclick="calGoToMonth(1)">&#8250;</button>
      </div>
    </div>
    <div class="cal-grid">${weekdayHeaders}${cells}</div>
    <div class="divider"></div>
    ${renderSelectedDayReminders()}`;
}

function budgetGoToMonth(delta) {

function budgetIncomeEntriesForMonth(key) { return STATE.budget.incomeLog[key] || []; }
function budgetIncidentalsForMonth(key) { return STATE.budget.incidentals[key] || []; }
function budgetAdditionalIncomeTotal(key) {
  return budgetIncomeEntriesForMonth(key).reduce((s, e) => s + (Number(e.amount) || 0), 0);
}
function budgetIncidentalsTotal(key) {
  return budgetIncidentalsForMonth(key).reduce((s, e) => s + (Number(e.amount) || 0), 0);
}
function budgetRecurringTotal() {
  return STATE.budget.recurring.filter(r => r.active).reduce((s, r) => s + (Number(r.amount) || 0), 0);
}
// Recurring charges flagged isSavings are still a reserved outflow (money leaving each month,
// same as rent or a subscription) but it's going toward the person's own savings/investments
// rather than spent — split out so the budget bar and legend can show that slice separately.
function budgetRecurringExpenseTotal() {
  return STATE.budget.recurring.filter(r => r.active && !r.isSavings).reduce((s, r) => s + (Number(r.amount) || 0), 0);
}
function budgetRecurringSavingsTotal() {
  return STATE.budget.recurring.filter(r => r.active && r.isSavings).reduce((s, r) => s + (Number(r.amount) || 0), 0);
}
// Every active recurring income source converted to its monthly-equivalent and summed — the
// steady figure the budget bar starts from each month, replacing the old flat monthlyIncome.
function recurringIncomeMonthlyTotal() {
  return STATE.budget.recurringIncome.filter(r => r.active).reduce((s, r) => {
    const freq = INCOME_FREQUENCIES[r.frequency] || INCOME_FREQUENCIES.monthly;
    return s + (Number(r.amount) || 0) * freq.perMonth;
  }, 0);
}
function budgetTotalIncome(key) {
  return recurringIncomeMonthlyTotal() + budgetAdditionalIncomeTotal(key);
}

// sources change rather than going stale. This is a planning/target figure only -- separate

function renderSavingsPlanSection() {
  const plan = STATE.budget.savingsPlan || { mode: 'percent', value: null };
  const monthlyIncome = recurringIncomeMonthlyTotal();
  const pct = plan.mode === 'percent' ? plan.value : (monthlyIncome > 0 && plan.value != null ? (plan.value / monthlyIncome * 100) : null);
  const amt = plan.mode === 'amount' ? plan.value : (plan.value != null ? (monthlyIncome * plan.value / 100) : null);
  const amtVal = plan.mode === 'amount' ? (plan.value ?? '') : (amt != null ? Math.round(amt * 100) / 100 : '');
  const pctVal = plan.mode === 'percent' ? (plan.value ?? '') : (pct != null ? Math.round(pct * 10) / 10 : '');

      <div class="field-row">

// ---- The budget bar: income width, a red line marking the recurring-reserved slice, and a
// growing fill for incidentals logged so far. Percentages are clamped purely for the visual
// (a maxed-out bar), while the remaining/over-budget text always uses the real dollar totals.
function renderBudgetBar(key) {
  const totalIncome = budgetTotalIncome(key);
  const recurringTotal = budgetRecurringTotal();
  const recurringExpenseTotal = budgetRecurringExpenseTotal();
  const recurringSavingsTotal = budgetRecurringSavingsTotal();
  const incidentalsTotal = budgetIncidentalsTotal(key);
  const remaining = totalIncome - recurringTotal - incidentalsTotal;
  const overBudget = remaining < 0;
  const safeIncome = totalIncome > 0 ? totalIncome : 1;
  const recurringExpensePct = totalIncome > 0 ? Math.max(0, Math.min(100, recurringExpenseTotal / safeIncome * 100)) : 0;
  const recurringSavingsPct = totalIncome > 0 ? Math.max(0, Math.min(100 - recurringExpensePct, recurringSavingsTotal / safeIncome * 100)) : 0;
  const recurringPct = recurringExpensePct + recurringSavingsPct;
  const incidentalsPct = totalIncome > 0 ? Math.max(0, Math.min(100 - recurringPct, incidentalsTotal / safeIncome * 100)) : 0;
  const baseIncome = recurringIncomeMonthlyTotal();
  const extraIncome = totalIncome - baseIncome;

  return `
    <div style="margin-bottom:14px;">
      <div style="font-size:11px; color:var(--text-faint); font-weight:700; letter-spacing:0.04em;">TOTAL INCOME THIS MONTH</div>
      <div style="font-family:var(--font-head); font-size:32px; font-weight:800;">${fmtMoney(totalIncome)}</div>
      <div style="font-size:11px; color:var(--text-faint);">${totalIncome <= 0 ? 'Add a recurring income source on the Recurring tab to get started.' : `Recurring ${fmtMoney(baseIncome)}${extraIncome ? ` + Extra ${fmtMoney(extraIncome)}` : ''}`}</div>
    </div>
    <div class="budget-bar ${overBudget ? 'budget-bar-over' : ''}">
      <div class="budget-bar-recurring" style="width:${recurringExpensePct}%;"></div>
      <div class="budget-bar-savings" style="left:${recurringExpensePct}%; width:${recurringSavingsPct}%;"></div>
      <div class="budget-bar-incidentals" style="left:${recurringPct}%; width:${incidentalsPct}%;"></div>
      ${recurringPct > 0 ? `<div class="budget-bar-line" style="left:${recurringPct}%;" title="Recurring charges: ${fmtMoney(recurringTotal)}"></div>` : ''}
    </div>
    <div class="budget-bar-legend">
      <span><i class="budget-dot" style="background:var(--bad);"></i>Recurring <b>${fmtMoney(recurringExpenseTotal)}</b></span>
      ${recurringSavingsTotal > 0 ? `<span><i class="budget-dot" style="background:var(--savings);"></i>Savings/Invest <b>${fmtMoney(recurringSavingsTotal)}</b></span>` : ''}
      <span><i class="budget-dot" style="background:var(--accent);"></i>Incidentals <b>${fmtMoney(incidentalsTotal)}</b></span>
      <span>${overBudget ? `<b style="color:var(--bad);">${fmtMoney(Math.abs(remaining))} over budget</b>` : `Remaining <b style="color:var(--good);">${fmtMoney(remaining)}</b>`}</span>
    </div>`;
}

function groupByTier(list) {
  const groups = {};
  list.forEach((item, i) => {
    const t = item.tier;
    if (!groups[t]) groups[t] = [];
    groups[t].push(Object.assign({}, item, { idx: i }));
  });
  return groups;
}

  const suppDone = SUPPLEMENTS.filter(s => suppLog[s.name]).length;

  const start = STATE.life.skinCycleStart;
  let skinBlock;
  if (!start) {
    skinBlock = `
      <div class="panel">
        <div class="subtle-label" style="margin-bottom:8px;">SKIN CYCLING</div>
        <div style="font-size:12px; color:var(--text-dim); margin-bottom:10px;">Set the date you started (or want to start) the 4-night rotation (Exfoliate / Retinoid / Recovery / Recovery) to see which night applies today.</div>
        <label class="field"><span class="lbl">Start Date</span><input type="date" id="skinStart" value="${todayStr()}"></label>
        <button class="btn btn-primary btn-block" onclick="setSkinCycleStart()">START ROTATION</button>
      </div>`;
  } else {
    const daysElapsed = Math.max(0, daysSince(start));
    const nightIdx = daysElapsed % 4;
    const night = SKIN_CYCLE_NIGHTS[nightIdx];
    skinBlock = `
      <div class="panel">
        <div class="row" style="margin-bottom:8px;">
          <div class="subtle-label" style="margin-bottom:0;">SKIN CYCLING</div>
          <button class="btn btn-ghost btn-sm" onclick="resetSkinCycle()">RESET</button>
        </div>
        <div style="font-size:13px; font-weight:700; margin-bottom:2px;">Tonight: Night ${nightIdx+1} &mdash; ${night.title}</div>
        <div style="font-size:12px; color:var(--text-dim);">${night.detail}</div>
        <div style="display:flex; gap:6px; margin-top:10px;">
          ${SKIN_CYCLE_NIGHTS.map((n,i) => `<div style="flex:1; text-align:center; padding:6px 2px; border-radius:4px; font-size:10px; font-weight:700; ${i===nightIdx?'background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-dim);':'background:var(--surface2); color:var(--text-faint); border:1px solid var(--border-soft);'}">N${i+1}</div>`).join('')}
        </div>
      </div>`;
  }

  return `
    <div class="panel">
      <div class="row" style="margin-bottom:8px;">
        <div class="subtle-label" style="margin-bottom:0;">SUPPLEMENTS TODAY</div>
        <span class="mono" style="font-weight:700; font-size:13px;">${suppDone} / ${SUPPLEMENTS.length}</span>
      </div>
      ${SUPPLEMENTS.map((s, i) => {
        const done = !!suppLog[s.name];
        return `<div onclick="toggleSupplement('${s.name.replace(/'/g,"\\'")}')" style="display:flex; gap:10px; align-items:center; padding:8px 0; ${i < SUPPLEMENTS.length-1?'border-bottom:1px solid var(--border-soft);':''} cursor:pointer;">
          <div class="hit-mark ${done?'hit':''}" style="flex-shrink:0;">${done?icon('check'):''}</div>
          <div>
            <div style="font-size:13px; font-weight:600;">${escapeHtml(s.name)}</div>
            <div style="font-size:11px; color:var(--text-faint);">${escapeHtml(s.dose)}</div>
          </div>
        </div>`;
      }).join('')}
      <div style="font-size:10px; color:var(--text-faint); margin-top:8px;">General reference ranges, not personalized medical dosing — confirm with a doctor before starting anything new, especially combining several.</div>
    </div>
    ${skinBlock}
    <div class="subtle-label" style="margin:18px 0 8px;">SLEEP &amp; CIRCADIAN (REFERENCE)</div>
    <div class="panel">
      ${SLEEP_PROTOCOLS.map((p,i) => `<div style="${i < SLEEP_PROTOCOLS.length-1?'margin-bottom:10px;':''}"><div style="font-size:13px; font-weight:600;">${escapeHtml(p.name)}</div><div style="font-size:11px; color:var(--text-dim); margin-top:2px;">${escapeHtml(p.how)}</div></div>`).join('')}
    </div>
  `;
}
function toggleSupplement(name) {
  const log = todaySupplementLog();
  log[name] = !log[name];
  saveState(); render();
}
function setSkinCycleStart() {
  const val = document.getElementById('skinStart').value || todayStr();
  STATE.life.skinCycleStart = val;
  saveState(); render();
}
function resetSkinCycle() {
  showConfirm('Reset the skin cycling rotation? You can set a new start date afterward.', () => {
    STATE.life.skinCycleStart = null;
    saveState(); render();
  });
}

// Mobile browsers never let a scroll/wheel gesture change a focused number input's value —
// only desktop does, via the native spin behavior — so block that path everywhere the spin
// buttons themselves are already hidden by CSS, and just let the gesture scroll the page instead.
document.addEventListener('wheel', function(e) {
  const t = e.target;
  if (t && t.tagName === 'INPUT' && t.type === 'number') {
    e.preventDefault();
    window.scrollBy(0, e.deltaY);
  }
}, { passive: false });

updateAllTMs();
applyAesthetic();
document.getElementById('settingsBtn').innerHTML = icon('settings');
document.getElementById('homeEditBtn').innerHTML = icon('pencil');
document.getElementById('backBtn').innerHTML = icon('back');
document.getElementById('forwardBtn').innerHTML = icon('forward');
document.getElementById('restTimerFab').innerHTML = icon('timer');
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
